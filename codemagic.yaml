# KING CAT — Codemagic の iOS ビルド設定（Capacitor 用）

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic         # Codemagicで登録したAPIキー名
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reo.kingcat         # KING CAT の Bundle ID
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"     # xcworkspace から xcodeproj に修正
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6811383615             # KING CAT の Store ID
      node: 20
    scripts:
      - name: ① 依存関係を入れる
        script: |
          npm ci

      - name: ② Web ファイルをアプリにコピー
        script: |
          npx cap sync ios
          echo "---- アプリに入る index.html の版 ----"
          grep -o "HTML_BUILD='[^']*'" ios/App/App/public/index.html || echo "⚠️ HTML_BUILD が見つかりません"

      - name: CocoaPods
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "Podfile が見つからないため CocoaPods をスキップします（SPMを使用）"
          fi

      - name: 署名の設定
        script: |
          xcode-project use-profiles

      - name: ③ ビルド番号を上げる
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "ビルド番号: $NEXT"
          cd ios/App && agvtool new-version -all $NEXT

      - name: ④ ビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
