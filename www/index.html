function bindInput(){
 const s=$('stage');
 const pt=e=>{const r=s.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  return{x:t.clientX-r.left,y:t.clientY-r.top};};
 const down=e=>{if(G.busy||G.over)return;A.unlock();
  const p=pt(e);
  if(G.mode){handlePick(p);e.preventDefault();return;}
  G.drag={x0:p.x,y0:p.y,wall:null,amt:0};e.preventDefault();};
 const move=e=>{if(!G.drag||G.busy)return;
  const p=pt(e),dx=p.x-G.drag.x0,dy=p.y-G.drag.y0,d=Math.hypot(dx,dy);
  const V=G.viewTo||G.view,th=Math.max(11,V.cell*.2);
  if(d<th){G.drag.wall=null;G.drag.amt=0;return;}
  /* drag inward: pulling right pushes the LEFT wall in */
  G.drag.wall=Math.abs(dx)>Math.abs(dy)?(dx>0?'left':'right'):(dy>0?'up':'down');
  G.drag.amt=clamp((d-th)/(V.cell*.8),0,1);
  e.preventDefault();};
 const up=e=>{if(!G.drag)return;const w=G.drag.wall;G.drag=null;
  if(w)push(w);e.preventDefault();};
 s.addEventListener('touchstart',down,{passive:false});
 s.addEventListener('touchmove',move,{passive:false});
 s.addEventListener('touchend',up,{passive:false});
 s.addEventListener('touchcancel',()=>{G.drag=null;});
 s.addEventListener('mousedown',down);
 addEventListener('mousemove',e=>{if(G.drag)move(e);});
 addEventListener('mouseup',e=>{if(G.drag)up(e);});
 addEventListener('keydown',e=>{
  if(!$('scPlay').classList.contains('on')||G.busy||G.over)return;
  const m={ArrowLeft:'right',ArrowRight:'left',ArrowUp:'down',ArrowDown:'up'};
  if(m[e.key]){e.preventDefault();A.unlock();push(m[e.key]);}
  if(e.key==='z')useItem('undo');});
}

function push(wall){
 if(G.busy||G.over)return;
 const res=doPush(G.st,wall,true);
 if(!res){A.block();shakeEl();vib(30);
  tip(rockBlocked(wall)?T('岩がじゃまで、その向きには押せません')
   :wall==='left'||wall==='right'?T('横に入りきりません'):T('縦に入りきりません'));
  return;}
 G.hist.push({st:bclone(G.st),ox:G.ox,oy:G.oy,score:G.score,moves:G.moves,items:{...G.items}});
 if(G.hist.length>50)G.hist.shift();
 G.moves++;
 G.busy=true;G.hint=null;
 A.slam();vib(11);shake(5);
 const kn=knacks();
 let gain=res.score;
 if(res.chain>1)gain=Math.round(gain*(1+kn.chain));
 gain=Math.round(gain*(1+kn.score));
 G.score+=gain;
 G.maxChain=Math.max(G.maxChain,res.chain);
 S.stat.pops+=res.popped;
 if(res.chain>=2)S.stat.chain2=(S.stat.chain2||0)+1;
 if(res.chain>=3)S.stat.chain3++;
 S.stat.maxChain=Math.max(S.stat.maxChain||0,res.chain);
 /* one camera per frame so the zoom rides the shrink exactly */
 const views=res.frames.map(f=>viewFor({w:f.w,h:f.h},f.ox,f.oy));
 const events=[];
 res.frames.forEach((f,i)=>{if(f.k==='pop')events.push({at:i,cells:f.cells,chain:f.chain,done:false});});
 G.anim={t0:performance.now(),dur:clamp(res.frames.length*140,420,2100),
  frames:res.frames,views,events,look:res.look,result:res,wall,boinged:false};
 paintHud();
}
function finishAnim(){
 const r=G.anim.result;G.anim=null;
 G.st=r.st;G.ox=r.ox;G.oy=r.oy;
 G.view=G.viewTo||G.view;G.viewTo=viewFor(G.st,G.ox,G.oy);G.viewT=0;
 G.busy=false;paintHud();paintItems();
 if(isWin(G.st)){win();return;}
 if(!anyPush(G.st)){lose();return;}
 /* Telling the player the board is already dead is not a spoiler — it saves
    them from three pointless moves and turns the moment into a rewind

 G.dead=!winnable(G.st);

/* --------------------------------------------------------------------- items */

/* ==========================================================================
   SKIP
   A stage nobody can finish is the one way a 1000-stage game loses a player
   for good, so there is always a door out. Skipping unlocks the next stage
   and records one star — enough that progression can never stall — but not
   three, so the ladder still means something.

   It is deliberately cheap rather than free-with-no-friction: three failures
   on the same board, OR a board the engine has proved is already dead. The
   guard below is the important part: it is impossible to be stuck with no
   way forward, because the button appears exactly when you are.
   ========================================================================== */
/* Two skips a day. Enough that nobody is ever walled in permanently, few
   enough that skipping is not simply how you play the game. */
const SKIP_PER_DAY=2;
function skipsLeft(){
 if(!S.skip||S.skip.day!==today())return SKIP_PER_DAY;
 return Math.max(0,SKIP_PER_DAY-(S.skip.used||0));
}
function skipAllowed(){
 if(G.trialOn)return false;
 if(skipsLeft()<=0)return false;
 if(G.dead)return true;
 if(S.rescue&&S.rescue.stage===G.stage&&S.rescue.fails>=3)return true;
 return (S.skipFails&&S.skipFails[G.stage]>=3);
}
function noteFail(stage){
 if(!S.skipFails)S.skipFails={};
 S.skipFails[stage]=(S.skipFails[stage]||0)+1;
}
function doSkip(){
 const n=G.stage;
 /* ZERO stars: the next stage opens so nobody is ever stuck, but the board
    stays visibly unsolved and contributes nothing to ★ totals, the season
    lane or medals. Skipping buys progress, never credit. */
 if(n>S.cleared)S.cleared=n;
 if(!S.skipped)S.skipped={};
 S.skipped[n]=1;
 if(!S.skip||S.skip.day!==today())S.skip={day:today(),used:0};
 S.skip.used=(S.skip.used||0)+1;
 save();
 A.click();toast(T('このステージは飛ばしました'));
 $('ovResult').classList.remove('on');
 if(n<TOTAL)startStage(n+1);else goHome();
}
function askSkip(){
 confirmBox(T('このステージを飛ばす'),
  T('つまずいたステージは飛ばせます。<br><br>')
  +T('飛ばしたステージは <b>★0</b> のまま、次のステージだけが開きます。')
  +T('あとから何度でも やりなおして ★★★ を取り直せます。<br>')
  +T('今日はあと <b>')+skipsLeft()+T('回</b> とばせます。'),
  T('とばす'),doSkip);
}
function useItem(k,free){
 if(G.busy&&k!=='undo')return;
 if(k==='undo'){
  if(!G.hist.length){tip(T('戻れません'));return;}
  if(!free&&G.items.undo<=0){adFor('undo');return;}
  const h=G.hist.pop();
  G.st=h.st;G.ox=h.ox;G.oy=h.oy;G.score=h.score;G.moves=h.moves||0;
  if(!free)G.items.undo--;
  G.anim=null;G.busy=false;G.over=false;G.mode=null;G.pick=[];G.hint=null;G.dead=false;
  G.view=viewFor(G.st,G.ox,G.oy);G.viewTo=G.view;G.viewT=1;
  A.click();paintHud();paintItems();return;}
 if(k==='hint'){
  if(!free&&G.items.hint<=0){adFor('hint');return;}
  const d=bestWall(G.st);
  if(!d){tip(T('もう押せません'));return;}
  if(!free)G.items.hint--;
  G.hint=d;A.click();paintItems();
  setTimeout(()=>{if(G.hint===d)G.hint=null;},4600);return;}
 /* paw and swap both take TWO taps. Removing a single cat used to be able to
    strand a colour on an odd count and quietly kill the board; taking two at
    once keeps every colour reachable, and swapping never changes a count at
    all, so it is the safe tool when you have painted yourself into a corner. */
 if(k==='paw'||k==='swap'){
  if(G.items[k]<=0){adFor(k);return;}
  G.mode=(G.mode===k)?null:k;G.pick=[];paintItems();
  tip(G.mode==='paw'?T('同じ種類の猫を2匹選んでね（王様は消せません）')
     :G.mode==='swap'?T('入れ替えたい猫を2匹選んでね')
     :'');return;}
}
/* Two-tap items. The king is never a valid paw target, so the win condition
   itself can never be destroyed. */
function cellAt(p){
 const V=G.viewTo||G.view;
 const c=Math.round((p.x-G.size/2)/V.cell+V.cx-.5)-G.ox;
 const r=Math.round((p.y-G.size/2)/V.cell+V.cy-.5)-G.oy;
 if(r<0||c<0||r>=G.st.h||c>=G.st.w)return null;
 return{r,c,v:G.st.g[r][c]};}
function handlePick(p){
 const k=G.mode;
 const t=cellAt(p);
 if(!t||t.v===null||t.v===ROCK){shakeEl();A.block();return;}
 if(k==='paw'&&t.v===KING){tip(T('王様は消せません！'));shakeEl();A.block();return;}
 if(G.pick.some(q=>q.r===t.r&&q.c===t.c)){
  G.pick=G.pick.filter(q=>!(q.r===t.r&&q.c===t.c));A.click();return;}
 /* Same-kind only for the paw. Taking two arbitrary cats leaves two colours
    on an odd count and kills roughly half of all boards; taking a matching
    pair leaves every count even and keeps ~88% of them solvable. */
 if(k==='paw'&&G.pick.length===1&&G.pick[0].v!==t.v){

 G.hist.push({st:bclone(G.st),ox:G.ox,oy:G.oy,score:G.score,moves:G.moves,items:{...G.items}});
 G.moves++;G.items[k]--;G.usedItems=(G.usedItems||0)+1;

  const tmp=G.st.g[a.r][a.c];G.st.g[a.r][a.c]=G.st.g[b.r][b.c];G.st.g[b.r][b.c]=tmp;

/* Stars are pure push economy now. `par` is the proven optimum, so
   ★★★ means "you found the shortest squeeze", not "you got lucky with
   a big chain". 猫パンチ counts as a push, otherwise items would buy
   stars outright. */
/* One move of slack on top of par, so a single item use — or one honest
   wrong turn you rewound — still leaves ★★★ on the table. */
const starTgt=()=>G.par+1+(knacks().star||0);
const starsGot=()=>G.moves<=starTgt()?3:G.moves<=starTgt()+1?2:1;

 if(G.over)return;G.over=true;G.busy=false;
 const st=starsGot();

 popText(G.size/2,G.size*.4,T('王様 みっけ！'),'#ffd76b');
 if(G.trialOn){trialAdvance();return;}
 const prev=S.stars[G.stage]||0,first=prev===0;
 let coins=0;const rw=[];
 /* ECONOMY — v1.3 tuning. Every sardine payout in the game was cut to
    roughly 70% of what it was, because a gacha pull at 🐟100 was arriving
    faster than the collection could absorb it. Nothing was made rarer and
    no price went up; the drip is simply slower. The numbers are written out
    literally rather than multiplied by a constant so that what the reward
    pills say is exactly what lands in the wallet. */
 if(first){coins+=8;rw.push([T('初クリア'),'🐟8']);}
 if(st>prev){S.stars[G.stage]=st;const b=(st-prev)*6;coins+=b;rw.push([T('★ボーナス'),'🐟'+b]);
  S.stat.stars=(S.stat.stars||0)+(st-prev);}
 if(G.stage>S.cleared)S.cleared=G.stage;
 if(G.maxChain>=3){coins+=G.maxChain*2;rw.push([G.maxChain+T('連鎖'),'🐟'+G.maxChain*2]);}
 if(first&&G.stage%10===0){S.items.hint++;S.items.undo++;rw.push([T('アイテム'),'＋1']);}
 if(G.daily&&S.dc.day===today()&&!S.dc.done){
  S.dc.done=true;S.dcClears=(S.dcClears||0)+1;coins+=20;rw.push([T('今日の一問'),'🐟20']);}
 if(knacks().keep&&G.usedItems)rw.push([T('持ち帰り'),'＋1']);
 S.stat.clears++;
 const mv=S.moves[G.stage];
 if(mv===undefined||G.moves<mv)S.moves[G.stage]=G.moves;
 const best=G.score>(S.best[G.stage]||0);
 if(best)S.best[G.stage]=G.score;

/* ----------------------------------------------------------------- sheets */
let sheetTab='home';
/* Every sheet used to close straight to home, so backing out of a costume
   picker dumped you three screens away from where you were. The stack keeps
   the trail; the back button walks it one step at a time. */
let sheetStack=[];
/* Re-rendering a screen in place — flipping a setting, buying something,
   changing the language — is done by calling that screen's own open*()
   again. Each of those calls pushed a fresh copy of itself onto the stack,
   so a player who nudged the volume four times had to tap the X five times
   to get out. Every entry point is a closure with identical source text, so
   comparing that text tells us "this is the same screen redrawing itself"
   and the top entry is replaced rather than stacked. Drilling genuinely
   deeper (shop -> theme picker) still pushes, because the source differs. */
function sheetPush(fn){
 const top=sheetStack[sheetStack.length-1];
 if(top&&String(top)===String(fn)){sheetStack[sheetStack.length-1]=fn;return;}
 sheetStack.push(fn);}
/* Every top-level screen (openGuild, openGacha, ...) pushes itself onto the
   stack the moment it opens, which is what lets a screen reached by drilling
   down (a cat's costume picker, say) walk back one step at a time. But the
   bottom tab bar and the hamburger menu are lateral jumps, not drill-downs —
   tapping Shop while Gacha is open should replace the destination, not add
   to a trail. Without this reset, ✕ on Shop was stepping back into Gacha
   instead of closing, because the old Gacha entry was still sitting under
   it. Every top-level entry point clears the trail first. */
function navTop(fn){sheetStack=[];fn();}
function sheetBack(){
 sheetStack.pop();                      /* drop the screen we are on */
 const prev=sheetStack.pop();           /* the one before it re-pushes itself */
 if(prev){prev();return true;}
 closeSheet();return false;
}
function sheet(title,build,tab){

 b.scrollTop=keep;
 $('sheet').classList.add('on');closeDrawer();
 /* Always ✕. It still steps back one level rather than closing outright, so
    leaving a shop sub-page returns you to the shop — but the icon does not
    change under the player's finger, which is what made it feel unreliable. */
 $('sheetX').textContent='✕';}
function closeSheet(){
 sheetStack=[];
 $('sheet').classList.remove('on');
 sheetTab='home';setTab('home');paintHome();paintTop();}

function catCv(kind,px,king,skin,cos){const cv=el('canvas');cv.width=cv.height=px||170;
 drawCat(cv.getContext('2d'),(px||170)*.47,(px||170)*.60,(px||170)*.62,kind,
  {king:!!king,skin:skin||null,cos:cos||null,glow:!!skin,rays:!!skin,sparkle:!!skin,now:performance.now()});

/* One roll, one grant. The ten-draw is ten of these plus a floor on the
   rarest slot, so the published odds stay exactly what the odds screen says
   for every individual pull. */
function rollRarity(min){
 const rn=Math.random();
 let rar=rn<ODDS[5]?5:rn<ODDS[5]+ODDS[4]?4:3;
 if(min&&rar<min)rar=min;
 return rar;
}
/* A slice of every draw comes back as a costume instead of a cat, so the
   gacha keeps giving once the roster is full. Returns null when the player
   already owns every outfit. */
/* Once a cat is in your corps, her outfit is exactly as likely as another
   copy of her. The draw builds one flat list per rarity — every cat of that
   rarity, plus the still-unwon outfit of each cat you already own — and picks
   uniformly. Nothing is weighted, so the published odds stay honest and a
   duplicate stops feeling like the pool is mocking you.

   Cats still dominate early for a structural reason rather than a tuned one:
   an outfit cannot enter the list until its cat has joined you. */
function drawPool(rar){
 const out=[];
 for(const p of PARTNERS)if(p.r===rar)out.push({kind:'cat',p});
 /* An outfit sits in ITS CAT'S rarity slot, not its own. Her display rarity
    still drives the label and the bonus, but for the draw she is one entry
    beside her owner — so a cat with three outfits is four equal outcomes
    (25% each) and one with four is five (20% each). */
 for(const c of COSTUMES){
  const p=CATALOG.find(x=>x.id===c.cat);
  if(!p||p.r!==rar)continue;
  if(S.dex[c.cat]&&!(S.cos&&S.cos[c.id]))out.push({kind:'cos',c});}
 return out;
}
function rollCos(){return null;}   /* superseded by drawPool */
function rollCat(min){
 const rar=rollRarity(min);
 let cand=PARTNERS.filter(p=>p.r===rar);
 if(!cand.length)cand=PARTNERS;
 return{p:cand[Math.floor(Math.random()*cand.length)],rar};
}
/* One draw: rarity first, then a uniform pick from that rarity's flat list.
   `min` floors the rarity and forces a cat, for the guaranteed slot. */
/* Rarity picks the cat, then the cat decides what she hands over. Once she
   is yours the split is fixed and published: 30% another copy of her,
   35/25/10 across her ★3, ★4 and ★5 outfits. Groups she has already
   completed drop out and their share is redistributed, so the last outfit
   never becomes unreachable. */
const COS_W={cat:30,3:35,4:25,5:10};
function rollOne(min){
 const rar=rollRarity(min);
 if(min)return{kind:'cat',rar,p:rollCat(min).p};
 let cand=PARTNERS.filter(p=>p.r===rar);
 if(!cand.length)cand=PARTNERS;
 const p=cand[Math.floor(Math.random()*cand.length)];
 if(!S.dex[p.id])return{kind:'cat',rar,p};
 const left=COSALL(p.id).filter(c=>!(S.cos&&S.cos[c.id]));
 if(!left.length)return{kind:'cat',rar,p};
 const groups=[{key:'cat',w:COS_W.cat,items:null}];
 for(const t of[3,4,5]){
  const g=left.filter(c=>c.r===t);
  if(g.length)groups.push({key:t,w:COS_W[t],items:g});}
 let tot=0;for(const g of groups)tot+=g.w;
 let r=Math.random()*tot;
 for(const g of groups){
  r-=g.w;
  if(r>0)continue;
  if(!g.items)return{kind:'cat',rar,p};
  return{kind:'cos',rar,c:g.items[Math.floor(Math.random()*g.items.length)]};}
 return{kind:'cat',rar,p};
}
/* A duplicate pays a MEDAL SHARD rather than sardines. Sardines only buy
   more draws, so paying duplicates in sardines just feeds the same slot
   machine; shards buy things you choose, on a scale you can see. The rates
   are set so tools are a few duplicates away and a guaranteed ★4 takes real
   time — roughly forty ★3 duplicates, which is a goal rather than a tease. */
const DUPE_SHARD={3:1,4:4,5:12};
function addShard(n){S.shard=(S.shard||0)+n;return n;}
function grantCat(p,rar){
 const dupe=!!S.dex[p.id];
 let shard=0;
 if(dupe)shard=addShard(DUPE_SHARD[rar]||1);else S.dex[p.id]=1;
 if(!dupe&&S.equip.length<slots())S.equip.push(p.id);
 return{p,rar,dupe,shard,coins:0};
}

/* Order matters: a cat is the headline of every draw, an outfit is the
   consolation, a theme is the rare surprise. Themes are checked last and at
   the lowest rate, and an outfit can only appear for a cat you already
   have — so the sequence a player experiences is always cat first. */
function gacha(){
 /* themes stay the rare surprise and are checked on their own low gate */
 const t0=rollTheme();
 if(t0){S.themes[t0.id]=1;save();A.reveal(t0.r);revealTheme(t0);return;}
 const one=rollOne(0);
 if(one.kind==='cos'){S.cos[one.c.id]=1;save();A.reveal(one.c.r);revealCos(one.c);return;}
 const res=grantCat(one.p,one.rar);
 const p=res.p,rar=res.rar,dupe=res.dupe,shard=res.shard;
 save();A.reveal(rar);
 if(rar>=4)flashLayer('flashGold',500);
 $('revealHero').innerHTML='';
 const cv=el('canvas');cv.width=cv.height=320;
 drawCat(cv.getContext('2d'),150,192,208,p.k,{mood:'happy',glow:rar>=4,
  rays:rar>=5,sparkle:rar>=5,skin:catSkin(p),now:performance.now()});
 $('revealHero').appendChild(cv);
 $('gName').textContent=catName(p);

/* Ten at once. Slot 10 is floored at ★4 so a ten-draw always feels like an
   event; every other slot uses the published odds untouched. */
function gacha10(){
 const res=[],cos=[];
 for(let i=0;i<10;i++){
  /* the guaranteed ★4 slot is always a cat, so an outfit can never eat it */
  const min=(i===9&&!res.some(r=>r.rar>=4))?4:0;
  const one=rollOne(min);
  if(one.kind==='cos'){S.cos[one.c.id]=1;cos.push(one.c);continue;}
  res.push(grantCat(one.p,one.rar));
 }
 save();
 const top=Math.max(0,...res.map(r=>r.rar),...cos.map(c=>c.r));
 A.reveal(top);
 if(top>=5)flashLayer('flashMag',560);else if(top>=4)flashLayer('flashGold',500);
 $('g10Eye').textContent=T('猫を呼ぶ');
 $('g10Title').textContent=T('10連の結果');
 const g=$('g10Grid');g.innerHTML='';
 res.forEach((r,i)=>{
  const c=el('div','g10c'+(r.rar>=5?' r5':r.rar>=4?' r4':''));
  c.style.animationDelay=(i*55)+'ms';
  if(!r.dupe)c.appendChild(el('div','nw',T('NEW')));
  else{const fb=el('div','nw fish','🔷+'+r.shard);c.appendChild(fb);}
  c.appendChild(catCv(r.p.k,120,false,catSkin(r.p)));
  c.appendChild(el('div','nm',catName(r.p)));
  const rr=el('div','rr','★'.repeat(r.rar));rr.style.color=RCOL[r.rar];
  c.appendChild(rr);
  g.appendChild(c);
 });
 /* costumes share the grid; they are always new, because a duplicate outfit
    is never rolled in the first place */
 cos.forEach((c2,i)=>{
  const c=el('div','g10c'+(c2.r>=5?' r5':c2.r>=4?' r4':''));
  c.style.animationDelay=((res.length+i)*55)+'ms';
  c.appendChild(el('div','nw',T('NEW')));
  const cv=el('canvas');cv.width=cv.height=120;
  const cp=COSCAT(c2)||PARTNERS[0];
  drawCat(cv.getContext('2d'),120*.47,120*.60,120*.62,cp.k,
   {cos:c2.id,skin:catSkin(cp),mood:'happy',now:performance.now()});
  c.appendChild(cv);
  c.appendChild(el('div','nm',c2.ja));
  const rr=el('div','rr','★'.repeat(c2.r));rr.style.color=RCOL[c2.r];
  c.appendChild(rr);
  g.appendChild(c);
 });
 const nw=res.filter(r=>!r.dupe).length+cos.length;
 const fish=res.reduce((a,r)=>a+r.shard,0);
 $('g10Sum').innerHTML=T('新しい仲間 <b>')+nw+T('</b>匹')
  +(fish?T('　／　重複ぶん <b>🔷＋')+fmt(fish)+T('（かけら）</b>'):'')
  +'<br><span style="font-size:10.5px;color:var(--lo)">'
  +T('★5 ')+res.filter(r=>r.rar===5).length+T(' 匹 ／ ★4 ')+res.filter(r=>r.rar===4).length+T(' 匹')
  +'</span>';
 $('g10Close').textContent=T('閉じる');
 $('ovGacha10').classList.add('on');
 $('g10Close').onclick=()=>{$('ovGacha10').classList.remove('on');A.click();
  if($('sheet').classList.contains('on'))openGacha();};
}

   which reads as a settings screen rather than a store. Now: what you
   already own at the top, then one section per need, with the cats shown
   as actual drawn cats because that is the entire reason to buy one. */
function owns(id){
 const it=IAPBY(id);
 if(!it)return false;
 if(it.days)return false;
 if(S.owned[id])return true;
 if(S.owned.bundle&&id!=='starter'&&id!=='cats3'&&id!=='coss3')return true;

 return false;
}

   asks the player, and only a completed transaction calls back into
   grantIAP. The demo path exists solely so the file still works in a
   browser — it never runs when a bridge is present, because shipping a
   build that grants purchases locally would be both a security hole and
   an immediate rejection. */

  +(it.days?T('（買い切り・期間限定／自動更新なし）'):T('（買い切り・非消費型）'))+'<br><br>'
  +it.d+'<br><br>'
  +'<span style="font-size:11px;color:var(--lo)">'
  +T('これはデモ表示です。実機ではストアの購入画面が開きます。')+'</span>',

/* Ad placement matters more than the code: never during play, never right
   after a clear. Replace playAd() with the AdMob bridge when wrapping. */
let adN=0;
/* Rewarded video.

   Until now this was a 1.5s timer that always called done() — fine as a
   browser demo, but it meant the AdMob bridge was never actually reached and
   the reward was granted whether or not a video played. Now it asks the
   native layer first and only pays out when the native layer reports the
   view COMPLETED. A user who closes the video early gets nothing, which is
   both what AdMob requires and what stops the reward being free.

   The demo timer survives as the browser fallback, so the same file still
   runs in Safari. */
let adCb=null, adGuard=null, adKind=null;
/* Closing a REWARDED video early must withhold the reward — that is the
   whole contract. Closing an INTERSTITIAL must never block the player, since
   there is no reward to withhold and the only thing behind it is the rest of
   the game. Treating both the same way left the player stuck on a dead
   screen when they dismissed a between-stage ad. */
function adFinish(ok){
 const cb=adCb, kind=adKind;
 adCb=null; adKind=null;
 clearTimeout(adGuard); adGuard=null;
 $('adOv').classList.remove('on');
 if(kind==='interstitial'){ if(cb)cb(); return; }
 if(ok&&cb)cb();
 else if(!ok)toast(T('動画が最後まで再生されませんでした'));
}
function playAd(done){
 $('adOv').classList.add('on');
 if(native('showRewarded',{placement:'reward'})){
  adCb=done; adKind='rewarded';
  /* if the native side never answers (no fill, crash), never leave the
     player stuck behind the overlay */
  adGuard=setTimeout(()=>{adFinish(false);},30000);
  return;
 }
 setTimeout(()=>{$('adOv').classList.remove('on');done&&done();},1500);
}

   it earns: none at all for the first handful of stages, never twice inside
   two minutes, and never more often than one clear in three. */

 if(S.cleared<6){next();return;}

 adN++;if(adN%3!==0){next();return;}
 lastAdAt=Date.now();

/* ==========================================================================
   MAILBOX  ／ メールボックス
   The one channel this game has for handing something to the player after
   release — an apology for a bug, a small thank-you, a seasonal gift. There
   is no server, so a letter is not pushed: it ships inside the build and
   appears the moment the player updates. That means two rules.

   1. An id is FOREVER. S.mail.claim[id] is the only thing stopping a gift
      being taken twice, so never reuse an id and never renumber. Deleting a
      letter from this table is fine; changing what an existing id pays is
      not, because players who already claimed it will not get the difference
      and players who have not will get the new figure.
   2. `until` is optional and compares dates as plain YYYY-M-D strings built
      by today(). Leave it out for anything that should stay claimable, since
      a player who skips two months should still find their apology gift.

   Text is carried as ja/en on the letter itself rather than through T(),
   so adding a letter next release never means touching the EN table.
   ========================================================================== */
const MAILBOX=[
 {id:'m130_hello',
  ja:{t:'v1.3 へのアップデート、ありがとうございます',
      b:'いつも遊んでくださって ありがとうございます。\n'
       +'今回から <b>メールボックス</b> と <b>更新のおしらせ</b> が増えました。\n'
       +'これからのプレゼントや おわびは、すべてここにお届けします。\n\n'
       +'ごあいさつがわりに、少しですがどうぞ。'},
  en:{t:'Thank you for updating to v1.3',
      b:'Thank you for playing.\n'
       +'This update adds a <b>mailbox</b> and a <b>what’s new</b> page.\n'
       +'From now on every gift and every apology arrives here.\n\n'
       +'Here is a small something to start it off.'},
  fish:150, items:{hint:2,undo:2}},
 {id:'m130_balance',
  ja:{t:'煮干しの獲得量の調整について',
      b:'v1.3 で、煮干しの入る量を これまでの <b>およそ7割</b> に見直しました。\n'
       +'ガチャの値段（🐟100 ／ 10連 🐟900）は 据え置きです。\n'
       +'猫や着せ替えの排出率も 変えていません。\n\n'
       +'すでに持っている煮干しは そのまま残ります。\n'
       +'調整のおわびに、少しだけお受け取りください。'},
  en:{t:'About the sardine rebalance',
      b:'In v1.3 sardine income was reduced to <b>about 70%</b> of what it was.\n'
       +'Draw prices are unchanged (🐟100, or 🐟900 for ten).\n'
       +'No drop rate was touched.\n\n'
       +'Sardines you already have are untouched.\n'
       +'Please accept this with our apologies for the change.'},
  fish:300},
];
const mailBy=id=>MAILBOX.find(m=>m.id===id);
/* today() yields "2026-9-2", which does not sort, so expiry is compared on
   real dates rather than on the string. */
function mailLive(m){
 if(!m.until)return true;
 const d=new Date(m.until+'T23:59:59');
 return isNaN(d)?true:Date.now()<=d.getTime();
}
const mailList=()=>MAILBOX.filter(mailLive);
const mailUnclaimed=()=>mailList().filter(m=>!S.mail.claim[m.id]).length;
function mailTxt(m){return (LANG==='en'&&m.en)?m.en:m.ja;}
function mailRewardBits(m){
 const out=[];
 if(m.fish)out.push('🐟 '+fmt(m.fish));
 if(m.shard)out.push('🔷 '+fmt(m.shard));
 const nm={undo:T('巻き戻し'),hint:T('ヒント'),paw:T('猫パンチ'),swap:T('入れ替え')};
 for(const k in(m.items||{}))out.push(nm[k]+' ＋'+m.items[k]);
 return out;
}
/* Paid 'exact': the letter shows a figure, so the letter pays that figure.
   A party bonus on top would make the mail lie about its own contents. */
function mailClaim(m){
 if(!m||S.mail.claim[m.id])return false;
 S.mail.claim[m.id]=1;S.mail.read[m.id]=1;
 if(m.fish)addCoins(m.fish,'exact');
 if(m.shard)addShard(m.shard);
 for(const k in(m.items||{}))S.items[k]=(S.items[k]||0)+m.items[k];
 save();paintTop();paintTabBadge();
 return true;
}
function openMail(){sheetPush(()=>openMail());sheet(T('メールボックス'),b=>{
 const list=mailList();
 /* A letter with nothing attached is a notice, not a gift: opening the
    mailbox IS reading it, so settle it here rather than leaving a badge lit
    over a button that does not exist. */
 let settled=false;
 for(const m of list)
  if(!S.mail.claim[m.id]&&!mailRewardBits(m).length){
   S.mail.claim[m.id]=1;S.mail.read[m.id]=1;settled=true;}
 if(settled){save();paintTabBadge();}
 b.appendChild(el('div','','<div style="font-size:11.5px;color:var(--lo);line-height:1.7;margin-bottom:12px">'
  +T('おしらせと、そのときどきのプレゼントが届きます。<br>受け取ると 煮干しや道具がその場で入ります。</div>')));
 if(!list.length){
  b.appendChild(el('div','','<div style="text-align:center;color:var(--lo);font-size:12px;padding:26px 0">'
   +T('いま届いているものはありません。')+'</div>'));
  return;}
 const un=list.filter(m=>!S.mail.claim[m.id]);
 if(un.length>1){
  const all=el('button','btn gold wide',T('すべて受け取る')+'（'+un.length+'）');
  all.style.marginBottom='12px';
  all.onclick=()=>{let f=0;for(const m of un){if(mailClaim(m))f+=(m.fish||0);}
   A.coin();toast(f?T('すべて受け取りました　🐟＋')+fmt(f):T('すべて受け取りました'));openMail();};
  b.appendChild(all);}
 for(const m of list){
  const got=!!S.mail.claim[m.id],tx=mailTxt(m);
  const c=el('div','card');
  c.style.cssText='padding:13px;margin-bottom:9px;'
   +(got?'opacity:.62':'border-color:rgba(255,215,107,.42)');
  c.innerHTML='<div style="display:flex;align-items:flex-start;gap:9px">'
   +'<div style="font-size:19px;line-height:1">'+(got?'📭':'📬')+'</div>'
   +'<div style="flex:1;min-width:0">'
   +'<div style="font-weight:800;font-size:13px;line-height:1.45">'+tx.t
   +(got?T('<span class="tag">受取済</span>'):T('<span class="tag n">NEW</span>'))+'</div>'
   +'<div style="font-size:11.5px;color:var(--mid);line-height:1.75;margin-top:6px">'
   +tx.b.replace(/\n/g,'<br>')+'</div></div></div>';
  const bits=mailRewardBits(m);
  if(bits.length){
   const pr=el('div','');pr.style.cssText='margin-top:9px;display:flex;flex-wrap:wrap;gap:5px';
   for(const s of bits)pr.appendChild(el('div','pill',s));
   c.appendChild(pr);}
  if(m.until)c.appendChild(el('div','','<div style="font-size:10px;color:var(--lo);margin-top:7px">'
   +T('受け取り期限 ')+m.until+'</div>'));
  if(!got&&bits.length){
   const bt=el('button','btn gold wide',T('受け取る'));
   bt.style.marginTop='10px';
   bt.onclick=()=>{if(mailClaim(m)){A.coin();
    toast(bits.join('　／　'));openMail();}};

},'more');}

/* ==========================================================================
   RETENTION + REVENUE LAYER
   Everything below is still 100% offline. The only things that leave the
   device are the ad request and the store receipt, both handled by the
   native wrapper, never by this file.
   ========================================================================== */

/* Thin bridge the iOS/Android shell can implement. Safe no-op in a browser,
   so the same HTML runs in Safari, in a WKWebView and in a Capacitor build. */
function native(t,d){
 try{
  if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.native)
   {webkit.messageHandlers.native.postMessage(Object.assign({t},d||{}));return true;}
  if(window.KingCatsNative&&KingCatsNative.post)
   {KingCatsNative.post(JSON.stringify(Object.assign({t},d||{})));return true;}
 }catch(e){}
 return false;
}
/* SKStoreReviewController / In-App Review. Asked ONCE, and only after a
   3-star clear — i.e. at the exact moment the player feels good. Never on
   a loss, never on launch. */
function maybeAskReview(){
 if(S.rev)return;
 if((S.stat.plays||0)<25)return;
 S.rev=1;save();
 setTimeout(()=>native('review'),1400);
}

/* One stage a day, picked deterministically from the date — no server needed,
   and every device with the same date gets the same puzzle, which is what
   makes "今日の一問" shareable. */
function dcStage(){
 const t=today();let h=2166136261;
 for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}
 const pool=Math.max(1,Math.min(S.cleared+1,TOTAL));
 return 1+(Math.abs(h)%pool);
}

/* -------------------------------------------------- iCloud key-value sync */
let cloudT=null,cloudState='—';
function cloudPush(){
 clearTimeout(cloudT);
 cloudT=setTimeout(()=>{
  if(native('cloudSave',{key:SKEY,value:JSON.stringify(S)}))cloudState=T('保存しました');
 },3500);
}
/* the native side calls window.KingCats.cloudLoad(jsonString) once iCloud
   reports a payload. We never blindly overwrite: whichever save is further
   along wins, so opening the app on an old phone cannot erase a new one. */
function progressOf(o){
 try{return (o.cleared||0)*4+Object.values(o.stars||{}).reduce((a,b)=>a+b,0);}
 catch(e){return -1;}
}
window.KingCats={
 cloudLoad(json){
  try{
   const o=JSON.parse(json);
   /* This checked for v===2 while DEF() has written v:4 for two releases, so
      every iCloud payload was being rejected as "no cloud save" and a new
      phone silently started from zero. Compare against the live save version
      via DEF() so a future bump cannot reintroduce the same silent failure. */
   if(!o||o.v!==DEF().v){cloudState=T('同期データなし');return false;}
   if(progressOf(o)<=progressOf(S)){cloudState=T('この端末が最新です');return false;}
   S=Object.assign(DEF(),o);
   S.set=Object.assign(DEF().set,o.set||{});
   migrateAudio();
   S.items=Object.assign(DEF().items,o.items||{});
   S.stat=Object.assign(DEF().stat,o.stat||{});
   S.consent=Object.assign(DEF().consent,o.consent||{});
   S.trial=Object.assign(DEF().trial,o.trial||{});
   S.mail=Object.assign(DEF().mail,o.mail||{});
   S.mail.claim=S.mail.claim||{};S.mail.read=S.mail.read||{};
   save();cloudState=T('iCloudから復元しました');
   toast(T('iCloud から進行データを復元しました'));
   paintTop();goHome();
   return true;
  }catch(e){cloudState=T('復元に失敗しました');return false;}
 },
 setLang(l){setLang(l);},
 /* AdMob callbacks. The native layer calls rewardEarned() only when the user
    watched to the end, and adClosed() when the ad goes away for any reason. */
 rewardEarned(){adFinish(true);},
 adClosed(){if(adCb)adFinish(false);},
 adFailed(){if(adCb)adFinish(false);else $('adOv').classList.remove('on');},
 /* StoreKit finished a purchase or a restore. ids is an array of product
    identifiers the player is now entitled to. */
 purchaseDone(id,ok){
  if(ok){grantIAP(id);toast(T('購入しました'));}
  else toast(T('購入は完了しませんでした'));
  if($('sheet').classList.contains('on'))openShop();
 },
 restoreDone(ids){
  let n=0;
  try{for(const id of(ids||[])){if(IAPBY(id)&&!IAPBY(id).days){S.owned[id]=1;n++;}}}catch(e){}
  for(const p of PREMIUM)if(S.owned[p.id]||S.owned.bundle)S.dex[p.id]=1;
  save();refreshBanner();
  toast(n?T('購入を復元しました'):T('復元できる購入はありませんでした'));
  if($('sheet').classList.contains('on'))openShop();
 },
 /* iOS reports the remaining time of a non-renewing pass it has recorded */
 adFreeUntil(ms){
  if(ms&&ms>(S.adFreeUntil||0)){S.adFreeUntil=ms;save();refreshBanner();paintHome();}
 },
 cloudState(){return cloudState;}
};

function needConsent(){return (S.consent.ver||0)<PUBLISHER.termsVer;}
/* Consent is two layers on purpose: a short summary nobody can claim they
   did not read, and the complete text one tap away inside the same dialog.
   The Agree button stays disabled until the full text has actually been
   scrolled to the end, which is what "informed" is supposed to mean and
   what both stores increasingly look for. */
function openConsent(){
 const body=$('cnBody'),full=$('cnFull'),hint=$('cnHint'),note=$('cnNote'),
       read=$('cnRead'),ok=$('cnOk'),back=$('cnBack'),title=$('cnTitle');
 body.innerHTML=
  '<p>'+(LANG==='en'?'Before you play <b>'+PUBLISHER.appNameEn+'':'『'+PUBLISHER.appName)+T('』で遊ぶ前に、')
  +T('<b>利用規約</b>と<b>プライバシーポリシー</b>への同意をお願いします。</p>')
  +'<ul style="margin:10px 0 10px 18px;line-height:1.9">'
  +T('<li>アカウント登録は不要です。</li>')
  +T('<li>進行データは<b>この端末の中</b>に保存されます。')
  +T('（iCloudをオンにしている場合は Apple のiCloudにも保存されます）</li>')
  +T('<li>開発者はサーバーを持たず、プレイ内容を集めません。</li>')
  +T('<li>無料版では Google AdMob の広告を表示します。広告のために')
  +T('広告識別子などが使われることがあります。</li>')
  +T('<li>アプリ内には買い切りの有料アイテムがあります。</li>')
  +T('<li>猫の抽選に<b>現金は使えません</b>。確率は抽選画面に常時表示しています。</li>')
  +T('<li>光の点滅が苦手な方は「設定」から演出を弱められます。</li>')
  +T('<li>13歳未満のかたは保護者のかたと一緒に読んでください。</li>')
  +'</ul>';
 let reading=false;
 function paint(){
  body.style.display=reading?'none':'';
  full.classList.toggle('on',reading);
  hint.classList.toggle('on',reading);
  read.classList.toggle('hide',reading);
  ok.classList.toggle('hide',reading);
  back.classList.toggle('hide',!reading);
  note.style.display=reading?'none':'';
  title.textContent=reading?T('利用規約とプライバシーポリシー'):T('利用規約とプライバシー');
 }
 /* Opening the full text swaps the dialog into a reading mode; the ONLY
    button then is "back", so there is never a way to end up stranded in
    the small print with no route to the consent screen. */
 read.onclick=()=>{
  A.click();
  full.innerHTML=legalHTML();
  reading=true;paint();
  full.scrollTop=0;
  try{$('ovConsent').querySelector('.ovc').scrollTop=0;}catch(e){}
 };
 back.onclick=()=>{
  A.click();
  reading=false;paint();
  full.innerHTML='';
  try{$('ovConsent').querySelector('.ovc').scrollTop=0;}catch(e){}
 };
 hint.textContent=T('↑ 読み終えたら、この下のボタンで同意画面にもどれます。');
 back.textContent=T('同意画面にもどる');
 read.textContent=T('全文を読む（利用規約・プライバシーポリシー）');
 reading=false;paint();
 $('ovConsent').classList.add('on');
 ok.onclick=()=>{
  S.consent.ver=PUBLISHER.termsVer;S.consent.at=new Date().toISOString();
  S.consent.lang=LANG;save();
  $('ovConsent').classList.remove('on');
  A.click();
  setTimeout(askAdsConsent,260);
 };
}
/* Ads consent first, in plain language, THEN the OS prompt. Asking the system
   dialog cold is how apps get denied by 80% of users — and by review. */
function askAdsConsent(){
 if(S.consent.ads!==null&&S.consent.ads!==undefined){afterAds();return;}
 confirmBox(T('広告について'),
  T('このゲームは無料で遊べるかわりに広告を表示します。<br><br>')
  +T('<b>興味に合わせた広告</b>を許可すると、開発を続けやすくなります。')
  +T('許可しなくてもゲームの内容は変わりません。')
  +T('あとから「設定」でいつでも変えられます。'),
  T('許可する'),()=>{S.consent.ads=true;save();native('adConsent',{personalized:true});afterAds();});
 $('cNo').textContent=T('許可しない');
 $('cNo').onclick=()=>{$('ovConfirm').classList.remove('on');
  S.consent.ads=false;save();native('adConsent',{personalized:false});afterAds();};
}
function afterAds(){
 $('cNo').textContent=T('いいえ');
 if(S.consent.ads&&!S.consent.att){
  /* App Tracking Transparency. NSUserTrackingUsageDescription must be filled
     in on the native side or the build is rejected. */
  S.consent.att=1;save();
  setTimeout(()=>native('att'),400);
 }
 if(musicLevel())MUSIC.start();   /* no-op if already playing */
 if(!S.tut)setTimeout(openTut,420);
 else setTimeout(()=>{if(checkLogin())paintHome();},380);
}

/* ==========================================================================
   ENDGAME — 王の試練 (Trial of the King)
   An endless run, no items, no rewind. One dead end ends it. The puzzle at
   each depth is picked at random from a fixed difficulty band for that
   depth, so every attempt plays differently even at the same point in the
   run. Still no server: the randomness lives entirely on the device.
   ========================================================================== */
/* The trial used to be five fixed puzzles pulled from the back two thirds of
   the game, with no tools. Most runs ended on the first board, which makes a
   score chase pointless. It is now endless and starts easy: the difficulty
   band walks forward with every board you clear, so the run ends when you
   finally meet one you cannot solve rather than immediately. Score rewards
   depth and efficiency, so a long careful run beats a lucky short one. */
const TRIAL_UNLOCK=30;
const TR={idx:0,on:false,moves:0,score:0,seen:[],stage:0};
function trialOpen(){return S.cleared>=TRIAL_UNLOCK;}
/* The difficulty CURVE is fixed — depth n always maps to the same band of
   the game, so "五問目はだいたいこのくらい" stays a reliable feeling — but
   which puzzle inside that band gets played is random every single run.
   The old version hashed the date into the pick, so replaying the trial on
   the same day handed back the exact same five-then-onward puzzles, which
   is exactly what got stale. Math.random() has no memory of the date, so
   every attempt is its own shuffle within the same difficulty band. */
function trialPick(n){
 const prog=Math.min(1,n/24);
 const lo=Math.floor(TOTAL*(.03+.62*prog));
 const hi=Math.floor(TOTAL*(.14+.86*prog));
 const span=Math.max(1,hi-lo);
 let v=lo+Math.floor(Math.random()*span)+1,guard=0;
 while(TR.seen.indexOf(v)>=0&&guard++<span)v=lo+((v+37)%span)+1;
 return Math.max(1,Math.min(TOTAL,v));
}
function trialNext(){
 const n=trialPick(TR.idx);
 TR.seen.push(n);TR.stage=n;
 startStage(n,false,true);
}
function startTrial(){
 if(!trialOpen()){toast(T('ステージ ')+TRIAL_UNLOCK+T(' クリアで開きます'));return;}
 TR.idx=0;TR.on=true;TR.moves=0;TR.score=0;TR.seen=[];
 $('sheet').classList.remove('on');closeDrawer();
 toast(T('王の試練 ― 行けるところまで！'));
 trialNext();
}
function trialAdvance(){
 TR.moves+=G.moves;TR.score+=G.score;
 TR.idx++;
 toast(TR.idx+T(' 問突破！'));
 setTimeout(trialNext,900);
}
function trialResult(cleared){
 TR.on=false;
 const done=TR.idx;
 /* depth is the headline, efficiency the tiebreak */
 const rec=done*1000+Math.max(0,done*120-TR.moves*10)+Math.round(TR.score/10);
 const first=S.trial.day!==today();
 if(first){S.trial.day=today();S.trial.bestDay=0;}
 const dayBest=rec>(S.trial.bestDay||0);
 if(dayBest)S.trial.bestDay=rec;
 const allBest=rec>(S.trial.best||0);
 if(allBest)S.trial.best=rec;
 /* Paid only the moment a score is reached for the very first time — that
    is, only when this run sets a new all-time record. A run that merely
    repeats or falls short of what the player already achieved earns
    nothing, which is the honest reading of "報酬は初めて達成したときに":
    the reward marks new ground, not participation. Replaying to grind the
    same score twice pays exactly once, on the run that first got there. */
 let coins=0;
 if(allBest)coins=addCoins(Math.round(done*7+TR.score/23)+40);   /* v1.3: ~70% */
 checkAchv();pushScores();cloudPush();save();
 $('rRibbon').textContent='TRIAL OVER';
 $('rRibbon').style.background=cleared?'var(--foil)':'rgba(255,255,255,.08)';
 $('rRibbon').style.color=cleared?'#3a2600':'var(--mid)';
 $('rTitle').textContent=done+T(' 問突破');
 const ks=$('kingStage');ks.innerHTML='';
 const cv=el('canvas');cv.width=cv.height=300;
 cv.style.width='150px';cv.style.height='150px';
 drawCat(cv.getContext('2d'),142,182,200,0,
  {king:true,glow:true,rays:cleared,sparkle:cleared,mood:cleared?'happy':'idle',now:performance.now()});
 ks.appendChild(cv);
 $('rStars').style.display='none';
 $('rLine').innerHTML=T('記録 <b>')+fmt(rec)+'</b>'
  +(allBest?T('<br><b style="color:var(--gold)">自己最高記録 更新！</b>'):'')
  +T('<br><span style="font-size:11px;color:var(--lo)">合計 ')+TR.moves+T('手 ／ 今日の最高 ')
  +fmt(S.trial.bestDay||0)+T(' ／ 通算最高 ')+fmt(S.trial.best||0)+'</span>';
 const r=$('rRew');r.innerHTML='';
 if(allBest){
  r.appendChild(el('div','pill','🏆 '+T('自己ベスト更新')));
  r.appendChild(el('div','pill','🐟 ＋'+coins));
 }else{
  r.appendChild(el('div','','<div style="font-size:11px;color:var(--lo);padding:4px 2px">'
   +T('自己ベストを更新すると 🐟がもらえます')+'</div>'));
 }
 const b=$('rBtns');b.innerHTML='';
 const close=()=>$('ovResult').classList.remove('on');
 const again=el('button','btn gold',T('もう一度 挑む'));
 again.onclick=()=>{close();startTrial();};b.appendChild(again);
 const hm=el('button','btn ghost',T('ホームへ'));
 hm.onclick=()=>{close();maybeAd(goHome);};b.appendChild(hm);
 if(cleared){confetti(60,G.size||360);A.crown();}else A.lose();
 setTimeout(()=>$('ovResult').classList.add('on'),420);
}
function paintTrial(){
 const box=$('trBox');box.innerHTML='';
 const open=trialOpen();
 const c=el('div','');c.id='trCard';
 c.innerHTML=T('<div class="t">👑 王の試練　<span style="font-size:10px;color:var(--lo)">')
  +(open?T('エンドレス ／ スコアアタック'):T('ステージ ')+TRIAL_UNLOCK+T(' クリアで開放'))+'</span></div>'
  +'<div class="s">'+(open
   ? T('行けるところまで。進むほど難しくなります。<br>')
     +T('今日の最高 <b>')+fmt((S.trial.day===today()&&S.trial.bestDay)||0)+'</b>'
     +T(' ／ 通算最高 <b>')+fmt(S.trial.best||0)+'</b>'
   : T('行けるところまで挑む、エンドレスの腕試し。'))+'</div>';
 const b=el('button','btn '+(open?'mag':'ghost')+' sm',open?T('挑む'):'🔒');
 b.style.marginTop='10px';
 if(!open)b.disabled=true;else b.onclick=()=>{A.unlock();A.click();startTrial();};

const TIPS=[

 '王の試練は道具なしの5連戦。1日1回、記録が残ります。',
];
function splashStep(p){const f=$('spFill');if(f)f.style.width=Math.round(p*100)+'%';}
function splashGo(done){
 const art=$('spArt');
 if(art){const cv=el('canvas');cv.width=cv.height=300;
  drawCat(cv.getContext('2d'),142,182,200,0,
   {king:true,glow:true,rays:true,sparkle:true,mood:'happy',now:performance.now()});
  art.appendChild(cv);}
 const tip=$('spTip');
 if(tip)tip.textContent=T(TIPS[Math.floor(Math.random()*TIPS.length)]);
 const t0=performance.now();
 let p=0;
 const tick=()=>{

  splashStep(p);
  if(p<1){requestAnimationFrame(tick);return;}

/* ==========================================================================
   TITLE SCREEN
   Cats fall slowly through the background, squashing gently as they go. It
   is the puzzle's own art doing nothing in particular, which is the whole
   point of an attract screen: show the toy, then get out of the way.
   ========================================================================== */
function runTitle(done){
 const wrap=$('title'), cv=$('titleCv');
 if(!wrap||!cv){done();return;}
 $('titleTap').textContent=T('タップしてはじめる');
 const g=cv.getContext('2d');
 let W2=0,H2=0,dpr=Math.min(devicePixelRatio||1,2);
 function fit(){
  W2=wrap.clientWidth;H2=wrap.clientHeight;
  cv.width=W2*dpr;cv.height=H2*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
 }
 fit();

 /* --- drifting cats, the quiet background layer ---------------------- */
 const drift=[];
 for(let i=0;i<8;i++)drift.push({
  x:Math.random()*W2, y:Math.random()*H2,
  s:Math.min(W2,H2)*(.045+Math.random()*.04),
  v:8+Math.random()*16, ph:Math.random()*6.283,
  k:Math.floor(Math.random()*6)});

 /* --- the pile: cats asleep along the bottom edge ---------------------
    Two rows, the back one smaller and dimmer, each breathing on its own
    clock. Every so often one rolls over — a pile that only ever breathes
    stops being interesting after about ten seconds. */
 const pile=[];
 function buildPile(){
  pile.length=0;
  const base=Math.min(W2,H2);
  const front=Math.max(4,Math.round(W2/(base*.20)));
  for(let row=0;row<2;row++){
   const n=row?front-1:front;
   for(let i=0;i<n;i++){
    const s2=base*(row?.13:.16)*(.86+Math.random()*.28);
    pile.push({
     row,
     x:(W2/(n))*(i+.5)+(row?W2/(n*2):0)+(Math.random()-.5)*10,
     y:H2-s2*(row?.92:.30),
     s:s2, k:Math.floor(Math.random()*6),
     ph:Math.random()*6.283, rate:.55+Math.random()*.5,
     tilt:(Math.random()-.5)*.28,
     roll:0, rollT:4+Math.random()*14, jump:0});
   }}
  /* back row first, so the front row overlaps it and the pile reads as a
     pile rather than as two separate lines of cats */
  pile.sort((a,b)=>b.row-a.row);
 }
 buildPile();

 /* --- the king, strolling past every half minute or so ---------------- */
 const king={active:false, x:0, y:0, s:0, dir:1, t:0, next:6+Math.random()*10};

 /* --- the cat hanging off the K -------------------------------------- */
 const hang={ph:0, s:0, x:0, y:0};
 function placeHang(){
  const nm=$('titleName');
  if(!nm){hang.s=0;return;}
  const r=nm.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
  hang.s=Math.min(W2,H2)*.13;
  hang.x=r.left-wr.left+r.width*.10;
  hang.y=r.top-wr.top+r.height*.72;
 }
 placeHang();

 /* --- paw prints left by a tap ---------------------------------------- */
 const paws=[];
 function pawAt(x,y){
  paws.push({x,y,t:0,life:.9,r:Math.min(W2,H2)*.035,rot:(Math.random()-.5)*1.2});
 }
 function poke(x,y){
  pawAt(x,y);
  const reach=Math.min(W2,H2)*.30;
  for(const c of pile){
   const d=Math.hypot(c.x-x,(c.y)-y);
   if(d<reach)c.jump=Math.max(c.jump,1-(d/reach));
  }
  for(const c of drift){
   const d=Math.hypot(c.x-x,c.y-y);
   if(d<reach)c.ph+=1.4;
  }
 }

 let live=true,last=performance.now();
 function frame(now){
  if(!live)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(W2!==wrap.clientWidth||H2!==wrap.clientHeight){fit();buildPile();placeHang();}
  g.clearRect(0,0,W2,H2);

  /* background drifters */
  for(const c of drift){
   c.y+=c.v*dt;c.ph+=dt*.9;
   if(c.y-c.s>H2){c.y=-c.s;c.x=Math.random()*W2;}
   const blink=(Math.sin(c.ph*2.1)>.985)?.1:1;
   g.save();g.globalAlpha=.13;
   drawCat(g,c.x+Math.sin(c.ph)*10,c.y,c.s,c.k,
    {blink,squash:1+.06*Math.sin(c.ph*1.4),now});
   g.restore();
  }

  /* the king's walk */
  king.next-=dt;
  if(!king.active&&king.next<=0){
   king.active=true;
   king.s=Math.min(W2,H2)*.15;
   king.dir=Math.random()<.5?1:-1;
   king.x=king.dir>0?-king.s:W2+king.s;
   king.y=H2*(.52+Math.random()*.16);
   king.t=0;
  }
  if(king.active){
   king.t+=dt;
   king.x+=king.dir*Math.min(W2,H2)*.16*dt;
   if((king.dir>0&&king.x>W2+king.s)||(king.dir<0&&king.x<-king.s)){
    king.active=false;king.next=18+Math.random()*22;
   }else{
    /* a slight bounce and a lean in the direction of travel reads as
       walking without needing legs */
    const bob=Math.sin(king.t*6.2)*king.s*.05;
    g.save();g.globalAlpha=.9;
    drawCat(g,king.x,king.y+bob,king.s,0,
     {king:true,glow:true,sparkle:true,mood:'happy',
      tilt:king.dir*0.06+Math.sin(king.t*6.2)*.03,
      squash:1+.05*Math.sin(king.t*6.2),now});
    g.restore();
   }
  }

  /* the cat hanging from the logo */
  if(hang.s>0){
   hang.ph+=dt*1.5;
   const sw=Math.sin(hang.ph)*.22;
   g.save();
   g.translate(hang.x,hang.y);
   g.rotate(sw);
   /* the paw it is holding on with */
   g.strokeStyle='rgba(255,255,255,.20)';
   g.lineWidth=Math.max(1.4,hang.s*.05);g.lineCap='round';
   g.beginPath();g.moveTo(0,-hang.s*.10);g.lineTo(0,-hang.s*.46);g.stroke();
   drawCat(g,0,hang.s*.42,hang.s,3,
    {mood:'happy',squash:1.10,tilt:-sw*.5,now});
   g.restore();
  }

  /* the pile */
  for(const c of pile){
   c.ph+=dt*c.rate;
   c.rollT-=dt;
   if(c.rollT<=0){c.roll=1;c.rollT=8+Math.random()*16;}
   if(c.roll>0)c.roll=Math.max(0,c.roll-dt*1.6);
   if(c.jump>0)c.jump=Math.max(0,c.jump-dt*2.2);
   const breathe=1+.055*Math.sin(c.ph*1.7);
   const hop=Math.sin(Math.min(1,c.jump)*Math.PI)*c.s*.32;
   const rollT=Math.sin(c.roll*Math.PI)*.55;
   g.save();
   g.globalAlpha=c.row?.55:.95;
   drawCat(g,c.x,c.y-hop,c.s,c.k,
    {mood:c.jump>.05?'shock':'sleep',
     blink:1,
     squash:1/breathe,
     tilt:c.tilt+rollT,
     now});
   g.restore();
   /* a few Zs above the sleepers */
   if(c.jump<.02&&!c.row&&Math.sin(c.ph*1.7)>.9){
    g.save();g.globalAlpha=.30;g.fillStyle='#cfd8f5';
    g.font='700 '+Math.round(c.s*.20)+'px '+getComputedStyle(document.body).fontFamily;
    g.fillText('z',c.x+c.s*.42,c.y-c.s*.52);
    g.restore();
   }
  }

  /* paw prints fade out where you touched */
  for(let i=paws.length-1;i>=0;i--){
   const p=paws[i];p.t+=dt;
   if(p.t>=p.life){paws.splice(i,1);continue;}
   const u=p.t/p.life;
   g.save();
   g.globalAlpha=(1-u)*.55;
   g.translate(p.x,p.y);g.rotate(p.rot);
   const k=p.r*(.85+u*.5);
   g.fillStyle='#ffd7e6';
   g.beginPath();g.ellipse(0,k*.22,k*.46,k*.38,0,0,7);g.fill();
   for(let j=0;j<4;j++){
    const a=-Math.PI/2+(j-1.5)*.46;
    g.beginPath();
    g.ellipse(Math.cos(a)*k*.60,Math.sin(a)*k*.60+k*.06,k*.16,k*.20,a+Math.PI/2,0,7);
    g.fill();}
   g.restore();
  }
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);

 /* A tap does both: the cats react, and the game starts a beat later so the
    reaction is actually seen. Waiting for a second tap would be worse — the
    screen says "tap to start" and it has to mean it. */
 let leaving=false;
 const go=(ev)=>{
  A.unlock();
  if(musicLevel())MUSIC.start();
  const r=wrap.getBoundingClientRect();
  const x=(ev&&ev.clientX!==undefined)?ev.clientX-r.left:W2/2;
  const y=(ev&&ev.clientY!==undefined)?ev.clientY-r.top:H2*.7;
  poke(x,y);
  A.click();
  if(leaving)return;
  leaving=true;
  setTimeout(()=>{
   if(!live)return;live=false;
   wrap.classList.add('gone');
   setTimeout(()=>{wrap.remove();},480);
   done();
  },420);
 };
 wrap.addEventListener('pointerdown',go);
 wrap.addEventListener('keydown',go);
}

/* ==========================================================================
   PROFILE + RANKING
   The board is nine invented rivals, not other players. That is a deliberate
   choice rather than a shortcut: there is no server, so a real leaderboard
   would mean accounts, moderation and a privacy policy that says far more
   than this one does. What the rivals DO have to be is honest about what
   they are — the screen says so — and fair to play against, which means
   their scores are anchored to the player's own so the table is always
   winnable but never free.
   ========================================================================== */
const RANK_DAYS=2, RANK_N=10;
const RIVALS=['ミケ','クロ','シロ','トラ','ハチ','タマ','チビ','モモ','ソラ',
 'ゆき','あんこ','こむぎ','だいふく','れん','はな','ぽち','マロン','きなこ'];
function rankPeriod(){return Math.floor(Date.now()/86400000/RANK_DAYS);}
function rankSeed(p,i){
 let h=(p*2654435761^(i+17)*40503)>>>0;
 h^=h>>>13;h=Math.imul(h,1274126177)>>>0;
 return h;
}
const rnd01=(p,i)=>(rankSeed(p,i)%10000)/10000;
/* frame tiers, in points */
const FRAMES=[
 {pt:0,    id:'f0',  ja:T('なし')},
 {pt:1,    id:'f1',  ja:T('木の枠')},
 {pt:5,    id:'f2',  ja:T('銅の枠')},
 {pt:10,   id:'f3',  ja:T('銀の枠')},
 {pt:20,   id:'f4',  ja:T('金の枠')},
 {pt:50,   id:'f5',  ja:T('翡翠の枠')},
 {pt:100,  id:'f6',  ja:T('瑠璃の枠')},
 {pt:200,  id:'f7',  ja:T('紅玉の枠')},
 {pt:400,  id:'f8',  ja:T('虹の枠')},
 {pt:700,  id:'f9',  ja:T('星屑の枠')},
 {pt:1000, id:'f10', ja:T('王冠の枠')},
 {pt:1500, id:'f11', ja:T('伝説の枠')},
];
const FRAME_ART={
 f0:null,
 f1 :{a:'#8a6a44',b:'#c8a06a',w:.055},
 f2 :{a:'#8A5A2E',b:'#E0A96D',w:.06},
 f3 :{a:'#93A2BC',b:'#EEF3FA',w:.065},
 f4 :{a:'#C9932A',b:'#FFE9A8',w:.07},
 f5 :{a:'#2E8B6B',b:'#8FF0C8',w:.07},
 f6 :{a:'#2A55B8',b:'#8FC4FF',w:.075},
 f7 :{a:'#A81E3C',b:'#FF8FA8',w:.075},
 f8 :{rainbow:true,w:.08},
 f9 :{a:'#5B3EA8',b:'#E7DBFF',w:.08,stars:true},
 f10:{a:'#B8860B',b:'#FFF3C4',w:.085,crown:true},
 f11:{rainbow:true,w:.095,stars:true,crown:true},
};
function framesOwned(){const p=S.prof.pt||0;return FRAMES.filter(f=>p>=f.pt);}
function curFrame(){
 const id=S.prof.frame||'f0';
 return framesOwned().some(f=>f.id===id)?id:'f0';
}
/* Rivals sit around the player: a few below, most above, and they gain stars
   at a steady clip. A player who does nothing slides down the table; a
   player who clears a chapter climbs it. */
/* Stars EARNED during the period, not stars owned. Total-star tables reward
   the player who started earliest and lock everyone else out; a two-day
   window resets that every time, so a newcomer and a veteran are running the
   same race and yesterday's effort is what counts. */
function myGain(){return Math.max(0,starTot()-(S.rank.base||0));}
function rankBoard(){
 const p=rankPeriod();
 const day=Math.min(RANK_DAYS,(Date.now()/86400000)-p*RANK_DAYS);
 /* rivals earn at a pace scaled to what the player has been managing, with
    a floor so an idle player still has a table worth looking at */
 /* Pitched so a light session lands mid-table and a solid two days wins it:
    the top rival finishes near 1.9x the player's own recent pace. */
 const pace=Math.max(40,Math.round((S.rank.pace||60)));
 const rows=[];
 const used=[];
 for(let i=0;i<RANK_N-1;i++){
  const f=.35+rnd01(p,i)*1.55;          /* 0.35x .. 1.90x of that pace */
  /* no two rivals share a name — a table with three シロ reads as a bug */
  let ni=rankSeed(p,i+7)%RIVALS.length,guard=0;
  while(used.indexOf(ni)>=0&&guard++<RIVALS.length)ni=(ni+1)%RIVALS.length;
  used.push(ni);
  rows.push({name:RIVALS[ni]+(i%4===3?'さん':''),
   stars:Math.round(pace*f*(day/RANK_DAYS)), me:false,
   k:rankSeed(p,i+3)%6});
 }
 rows.push({name:S.prof.name||T('あなた'),stars:myGain(),me:true,k:-1});
 rows.sort((a,b)=>b.stars-a.stars||(a.me?-1:1));
 rows.forEach((r,i)=>r.pos=i+1);
 return rows;
}
function myRank(){const b=rankBoard();return b.find(r=>r.me).pos;}
const RANK_PT=[0,3,2,1];
/* Roll the table over when the three days are up: award points for the
   finishing position, then re-anchor to wherever the player now is. */
function rankSync(){
 const p=rankPeriod();
 if(S.rank.period===p)return false;
 if(S.rank.period){                    /* not the very first run */
  const pos=S.rank.lastPos||myRank();
  const pt=RANK_PT[pos]||0;
  if(pt){S.prof.pt=(S.prof.pt||0)+pt;
   S.rank.wins=S.rank.wins||{};S.rank.wins[pos]=(S.rank.wins[pos]||0)+1;}
  S.rank.prev={pos,pt};
 }
 /* remember how fast this player actually collects, so the next table is
    pitched at them rather than at an imaginary average */
 if(S.rank.period)S.rank.pace=Math.round(((S.rank.pace||36)*2+Math.max(30,myGain()))/3);
 S.rank.period=p;S.rank.base=starTot();
 S.rank.lastPos=0;
 save();
 return true;
}

/* ---------------------------------------------------------- the avatar */
function drawFrame(g,cx,cy,r,id,now){
 const f=FRAME_ART[id];if(!f)return;
 const lw=r*f.w;
 g.save();
 if(f.rainbow){
  const gr=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  ['#ff5fd0','#ffd76b','#6ee7a0','#54e9ff','#c98be0'].forEach((c,i,a)=>
   gr.addColorStop(i/(a.length-1),c));
  g.strokeStyle=gr;
 }else{
  const gr=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  gr.addColorStop(0,f.b);gr.addColorStop(.5,f.a);gr.addColorStop(1,f.b);
  g.strokeStyle=gr;
 }
 g.lineWidth=lw;
 g.beginPath();g.arc(cx,cy,r-lw/2,0,7);g.stroke();
 if(f.stars){
  const t=(now||0)/1400;
  g.fillStyle='#fff';
  for(let i=0;i<6;i++){
   const a=t+i*Math.PI/3, sx=cx+Math.cos(a)*(r-lw/2), sy=cy+Math.sin(a)*(r-lw/2);
   const k=r*.09;
   g.beginPath();
   g.moveTo(sx,sy-k);g.quadraticCurveTo(sx,sy,sx+k,sy);
   g.quadraticCurveTo(sx,sy,sx,sy+k);g.quadraticCurveTo(sx,sy,sx-k,sy);
   g.quadraticCurveTo(sx,sy,sx,sy-k);g.fill();}
 }
 if(f.crown)drawCrown(g,cx,cy-r+lw*.2,r*.62,Math.max(1.2,r*.05));
 g.restore();
}
function avatarCv(px2,frameId){
 const cv=el('canvas');cv.width=cv.height=px2;
 const g=cv.getContext('2d');
 const id=S.prof.icon;
 const p=allCats().find(x=>x.id===id&&S.dex[x.id]);
 const now=performance.now();
 g.save();
 g.beginPath();g.arc(px2/2,px2/2,px2*.40,0,7);g.clip();
 g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,0,px2,px2);
 if(p)drawCat(g,px2*.47,px2*.60,px2*.60,p.k,
  {cos:cosOf(p.id),skin:catSkin(p),glow:!!catSkin(p),mood:'happy',now});
 else drawCat(g,px2*.47,px2*.60,px2*.60,0,{king:true,glow:true,mood:'happy',now});
 g.restore();
 drawFrame(g,px2/2,px2/2,px2*.44,frameId||curFrame(),now);
 return cv;
}

/* ==========================================================================
   COSTUMES
   Every cat has ONE outfit of its own, and that outfit only enters the draw
   pool once the cat itself is in your corps. So a costume is never a prize
   for a cat you have never met — it is the reward for having met her.
   A costume carries the rarity of its owner, which is why a ★5 outfit is
   rare twice over: you need the ★5 first, then her outfit after.
   Nothing here is ever sold for money.
   ========================================================================== */
const CATALOG=PARTNERS.concat(PREMIUM);
const COSART={ribbon:T('リボン'),scarf:T('マフラー'),bell:T('鈴'),cap:T('帽子'),
 glasses:T('眼鏡'),flower:T('花飾り'),crownlet:T('小さな冠'),halo:T('光の輪')};
/* Outfit rarity is its own thing now, not simply the cat's. Three or four
   per cat means any single one is a 20-25% slice of that cat's wardrobe,
   which is the pacing asked for.

   Each one carries a small sardine bonus — small enough that dressing a cat
   is never a strategic obligation, big enough to be a reason to chase the
   rarer ones. Paid outfits sit far above this scale on purpose: they are the
   thing you can buy, so they had better be worth buying. */
const COS_TIER=[null,null,null,
 {r:3,coin:.10,ja:T('ふつう')},
 {r:4,coin:.15,ja:T('レア')},
 {r:5,coin:.20,ja:T('とてもレア')}];
const COS_SHAPES=['ribbon','scarf','bell','cap','glasses','flower','crownlet','halo'];
/* [cat id, shape, main colour, accent] — colours are picked to sit against
   that particular cat's coat rather than against the palette in general. */
const COSDEF=[
 ['mochi',    'ribbon',  '#FF6FA8','#FFD7E6'],
 ['torakit',  'scarf',   '#2FCFEA','#9BEFFF'],
 ['kuromame', 'bell',    '#E0455F','#FFF2C4'],
 ['soramame', 'cap',     '#6FE39A','#FFFFFF'],
 ['mikeko',   'flower',  '#FFD76B','#FF8FA8'],
 ['momoko',   'ribbon',  '#54E9FF','#CFF7FF'],
 ['kinako',   'glasses', '#3E4A7A','#BFEFFF'],
 ['yozora',   'cap',     '#5B62C8','#FFE9A8'],
 ['shirayuki','scarf',   '#6E8FE0','#DCE8FF'],
 ['ruri',     'bell',    '#C0392B','#FFF2C4'],
 ['happa',    'flower',  '#6FE39A','#FFF3B0'],
 ['komorebi', 'crownlet','#FFC53D','#FFF7D6'],
 ['tsukikage','halo',    '#B79BFF','#E7DBFF'],
 ['cat_gin',  'crownlet','#6FD8FF','#FFFFFF'],
 ['cat_ame',  'halo',    '#AE95FF','#DCD0FF'],
 ['cat_koha', 'glasses', '#FF9A3C','#FFE0B0'],
];
/* Each cat gets her hand-authored outfit at ★3, then two or three more built
   from other shapes at rising rarity. The extra shapes are chosen by walking
   the shape list from her own, so no cat ever gets the same shape twice and
   every cat's set looks different from her neighbour's. */
const COSTUMES=(function(){
 const out=[];
 COSDEF.forEach(function(d,ci){
  const p=CATALOG.find(x=>x.id===d[0])||CATALOG[0];
  const base=COS_SHAPES.indexOf(d[1]);
  const count=3+(ci%2);           /* three for some cats, four for others */
  for(let k=0;k<count;k++){
   const shape=k===0?d[1]:COS_SHAPES[(base+k*3+ci)%COS_SHAPES.length];
   const tier=k===0?3:(k===1?3:(k===2?4:5));
   const t=COS_TIER[tier];
   out.push({
    id:'cos_'+d[0]+(k?'_'+k:''),
    cat:d[0], art:shape, c1:k%2?d[3]:d[2], c2:k%2?d[2]:d[3],
    r:tier, coin:t.coin,
    ja:(LANG==='ja'?catName(p)+'の'+COSART[shape]:catName(p)+"'s "+COSART[shape])});
  }
 });
 return out;
})();
/* one lookup for both kinds — drawCos only needs .art/.c1/.c2 */
const COSBY=id=>COSTUMES.find(c=>c.id===id)||PCOSBY(id);
const COSFOR=catId=>COSTUMES.find(c=>c.cat===catId);
const COSALL=catId=>COSTUMES.filter(c=>c.cat===catId);
const COSOWNED=catId=>COSALL(catId).filter(c=>S.cos&&S.cos[c.id]);
const COSCAT=c=>CATALOG.find(x=>x.id===c.cat);
const COSNAME=id=>{const c=COSBY(id);return c?c.ja:id;};
const cosHave=catId=>COSOWNED(catId).length>0;
/* worn only if the outfit exists, is owned, and the switch is on */
/* Worn only if the outfit is actually available: a free outfit has to have
   dropped for that exact cat, a paid one has to have been bought. If either
   stops being true — a refund, a wiped save — the cat quietly goes bare
   rather than rendering something the player does not own. */
const cosOf=catId=>{
 const w=S.cosOn&&S.cosOn[catId];
 if(!w)return null;
 if(PCOSBY(w))return owns(w)?w:null;
 return (S.cos&&S.cos[w]&&COSALL(catId).some(c=>c.id===w))?w:null;};
/* Raised from .22: outfits only exist for cats you already own, so early on
   the pool is tiny and the old rate meant a full roster still took hundreds
   of draws to dress. */
/* Published, and deliberately ordered: cat > outfit > theme.
   62% cat / ~28% outfit (only once its cat is yours) / ~10% theme, and any
   pool that is empty simply hands the draw back to the cats. */
const COS_RATE=.28;
/* Only outfits belonging to cats you already have, and only ones you have
   not won yet. Empty pool means every pull is a cat. */
function cosPool(){return COSTUMES.filter(c=>S.dex[c.cat]&&!S.cos[c.id]);}
function cosGacha(){
 const un=cosPool();
 if(!un.length)return null;
 const rn=Math.random();
 let tier=rn<.10?5:rn<.38?4:3;
 let cand=un.filter(c=>c.r===tier);
 if(!cand.length)cand=un;
 return cand[Math.floor(Math.random()*cand.length)];
}

}

   +T('効果は、その猫を連れて行っているあいだだけ働きます。')+'</div>'));

  gb.style.marginTop='12px';gb.onclick=()=>openGacha();

/* ==========================================================================
   PARTY LOOK
   The cats you bring change what the stage looks like. A ★3 party gets a
   faint tint; a ★5 party gets drifting motes and a brighter frame. It costs
   nothing to compute and it makes the guild screen matter while you play.
   ========================================================================== */

/* ==========================================================================
   PARTY LOOK
   The cats you bring change what the stage looks like. A ★3 party gets a
   faint tint; a ★5 party gets drifting motes and a brighter frame. It costs
   nothing to compute and it makes the corps screen matter while you play.
   ========================================================================== */
function partyCats(){return S.equip.map(id=>allCats().find(p=>p.id===id)).filter(Boolean);}
/* Recomputed only when the party changes — draw() and the mote step both ask
   for it every frame, and rebuilding the roster sixty times a second for a
   four-element array is pure waste. */
let PLOOK=null;
function partyLook(){
 if(PLOOK)return PLOOK;
 const ps=partyCats();
 if(!ps.length)return PLOOK={tier:0,sum:0,rich:0,cols:['#54e9ff'],glow:['#54e9ff'],
  c1:'#54e9ff',c2:'#ff5fd0',motes:0};
 let top=0,sum=0;const cols=[],glow=[];
 for(const p of ps){
  top=Math.max(top,p.r);sum+=p.r;
  const K=p.skin?SKINS[p.skin]:KINDS[p.k%6];
  cols.push(K.fur);glow.push(K.aura||K.ring||K.fur);}
 const lead=ps.slice().sort((a,b)=>b.r-a.r)[0];
 const LK=lead.skin?SKINS[lead.skin]:KINDS[lead.k%6];
 /* rich 0..1 — average rarity drives how loud the show is, and the party
    size nudges it up a little so a full bench feels different from a solo */
 const rich=clamp((sum/ps.length-3)/2*.82+(ps.length-1)*.06,0,1);
 return PLOOK={tier:top,sum,rich,cols,glow,lead,
  c1:LK.ring||LK.fur,c2:(LK.aura||LK.fur),
  motes:Math.round(5*ps.length*(.4+rich)+(top>=5?12:0))};
}
let MOTES=[];
function motesStep(dt,SZ){
 const L=partyLook();
 const want=S.set.fx?Math.min(46,L.motes):0;
 while(MOTES.length<want)MOTES.push({x:Math.random()*SZ,y:Math.random()*SZ,
  r:SZ*(.004+Math.random()*.007*(1+L.rich)),vy:-(4+Math.random()*13),
  ph:Math.random()*6.283,sp:.5+Math.random(),
  ci:MOTES.length,st:Math.random()<L.rich*.7});
 while(MOTES.length>want)MOTES.pop();
 for(const m of MOTES){m.y+=m.vy*dt;m.ph+=dt*m.sp;
  if(m.y<-10){m.y=SZ+10;m.x=Math.random()*SZ;}}
}
/* The stage takes its colour from the cats you brought: one soft light per
   companion in that cat's own coat colour, a wash in the leader's, and — for
   a ★5 bench — slow rotating rays. Higher rarity, louder show. */
function drawPartyBg(g,SZ){
 const L=partyLook();
 if(!L.tier)return;
 const now=performance.now();
 const n=L.glow.length, base=.07+.15*L.rich;
 g.save();g.globalCompositeOperation='lighter';
 for(let i=0;i<n;i++){
  const a=-Math.PI/2+i/n*6.283+(S.set.fx?Math.sin(now/4200+i*1.7)*.18:0);
  const cx=SZ/2+Math.cos(a)*SZ*.36, cy=SZ/2+Math.sin(a)*SZ*.36;
  const gr=g.createRadialGradient(cx,cy,SZ*.02,cx,cy,SZ*.56);
  gr.addColorStop(0,L.glow[i]);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.globalAlpha=base;g.fillStyle=gr;g.fillRect(0,0,SZ,SZ);}
 const g2=g.createRadialGradient(SZ/2,SZ*.42,SZ*.04,SZ/2,SZ*.52,SZ*.82);
 g2.addColorStop(0,L.c1);g2.addColorStop(1,'rgba(0,0,0,0)');
 g.globalAlpha=base*.85;g.fillStyle=g2;g.fillRect(0,0,SZ,SZ);
 if(L.tier>=4){
  g.globalAlpha=.09+.13*L.rich;g.strokeStyle=L.glow[0];g.lineWidth=SZ*.014;
  g.beginPath();g.roundRect(SZ*.025,SZ*.025,SZ*.95,SZ*.95,SZ*.07);g.stroke();}
 if(L.tier>=5&&S.set.fx){
  /* one ray per companion, in that companion's colour, so a ★5 bench looks
     like the cats you actually picked rather than a generic light show */
  g.translate(SZ/2,SZ/2);g.rotate(now/9000);
  for(let i=0;i<6;i++){
   g.rotate(6.283/6);
   const rg=g.createLinearGradient(0,0,0,-SZ*.8);
   rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(.55,L.glow[i%n]);
   rg.addColorStop(1,'rgba(0,0,0,0)');
   g.globalAlpha=.05+.045*Math.abs(Math.sin(now/900+i));
   g.fillStyle=rg;
   g.beginPath();g.moveTo(0,0);g.lineTo(-SZ*.085,-SZ*.8);g.lineTo(SZ*.085,-SZ*.8);
   g.closePath();g.fill();}}
 g.restore();
 if(!MOTES.length)return;
 g.save();g.globalCompositeOperation='lighter';
 for(const m of MOTES){
  const c=L.glow[m.ci%L.glow.length];
  g.globalAlpha=.12+.20*Math.abs(Math.sin(m.ph));
  g.fillStyle=c;
  if(m.st)star4(g,m.x,m.y,m.r*2.1*(1+.3*Math.sin(m.ph)),m.ph);
  else{g.beginPath();g.arc(m.x,m.y,m.r*(1+.3*Math.sin(m.ph)),0,7);g.fill();}}
 g.restore();
}
/* the party strip: who came with you, wearing what */
function paintParty(){
 PLOOK=null;MOTES.length=0;
 const bar=$('partyBar');if(!bar)return;
 bar.innerHTML='';
 const ps=partyCats();
 /* the stage glow follows the party, so tell the page background too */
 try{const L=partyLook();
  document.documentElement.style.setProperty('--pty1',L.c1);
  document.documentElement.style.setProperty('--pty2',L.c2);}catch(e){}
 if(!ps.length){bar.classList.remove('on');return;}
 bar.classList.add('on');
 for(const p of ps){
  const d=el('div','pcat r'+p.r);
  const cv=el('canvas');cv.width=cv.height=96;
  const worn=cosOf(p.id);
  drawCat(cv.getContext('2d'),96*.47,96*.60,96*.62,p.k,
   {cos:worn,skin:catSkin(p),glow:p.r>=5,now:performance.now()});
  d.appendChild(cv);
  d.appendChild(el('i','',''+'★'.repeat(p.r)));
  if(worn)d.appendChild(el('b','','👗'));
  bar.appendChild(d);}
}
