<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<title>KING CAT</title>
<style>
/* Design language follows the established Gravity Pop Cats shell: deep space
   navy, glass surfaces, cyan / magenta / gold neon, foil for anything premium. */
:root{
  --bg-0:#070a14; --bg-1:#0d1120; --bg-2:#141a30;
  --surface:rgba(21,27,48,.88); --surface-2:rgba(30,38,66,.9);
  --line:rgba(255,255,255,.10); --line-s:rgba(255,255,255,.20);
  --edge:#3d4a7d;
  --cyan:#54e9ff; --magenta:#ff5fd0; --gold:#ffd76b; --green:#6ee7a0; --red:#ff7a7a;
  --hi:#fff; --mid:#c8d0ee; --lo:#8b95bd;
  --r1:#9aa4cc; --r2:#54e9ff; --r3:#c98be0; --r4:#ffd76b; --r5:#ff8ae0;
  --radius:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabH:53px; --bannerH:0px;
  --foil:linear-gradient(155deg,#fff2c4 0%,#ffd76b 22%,#c9932a 48%,#ffe9a8 66%,#b9821d 100%);
  --glass:linear-gradient(168deg,rgba(48,60,104,.72) 0%,rgba(22,29,54,.86) 58%,rgba(15,20,40,.92) 100%);
  --glass-2:linear-gradient(168deg,rgba(60,74,124,.70) 0%,rgba(28,36,66,.88) 100%);
  --lift:0 1px 0 rgba(255,255,255,.14) inset,0 -1px 0 rgba(0,0,0,.45) inset,
         0 10px 26px -12px rgba(0,0,0,.85),0 2px 6px -2px rgba(0,0,0,.6);
  --ink:0 1px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-0);color:var(--hi);user-select:none;-webkit-user-select:none;
 font-family:'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Segoe UI',system-ui,sans-serif;
 font-weight:600;letter-spacing:.01em;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-weight:800;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
#bgFX{position:fixed;inset:0;z-index:-2;overflow:hidden;
 background:radial-gradient(ellipse at 50% -12%,#1e2a5e 0%,transparent 62%),
            linear-gradient(180deg,var(--bg-0),var(--bg-2) 55%,var(--bg-0))}
#bgFX .blob{position:absolute;width:72vmax;height:72vmax;border-radius:50%;filter:blur(90px);
 opacity:.2;animation:drift 22s ease-in-out infinite alternate;will-change:transform}
#bgFX .b1{background:var(--cyan);top:-28%;left:-28%}
#bgFX .b2{background:var(--magenta);bottom:-32%;right:-22%;animation-duration:27s}
#bgFX .b3{background:var(--gold);top:22%;right:-38%;animation-duration:31s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(7%,9%) scale(1.16)}}
body.fx-off #bgFX .blob{animation:none}
/* while a stage is running the page glow matches the cats you brought */
body.playing #bgFX .b1{background:var(--pty1,#54e9ff)}
body.playing #bgFX .b2{background:var(--pty2,#ff5fd0)}
body.playing #bgFX .blob{opacity:.26}
#starfield{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5}
/* ---- purchased themes. Switched on and off in メニュー →「テーマ」 ---- */
body[data-theme="wa"] #bgFX{background:radial-gradient(ellipse at 50% -12%,#6b5228 0%,transparent 62%),
 linear-gradient(180deg,#181205,#2f2413 55%,#120d04)}
body[data-theme="wa"] #bgFX .b1{background:#e8c98a}
body[data-theme="wa"] #bgFX .b2{background:#8fbf6a}
body[data-theme="wa"] #bgFX .b3{background:#d9a05b}
body[data-theme="wa"] #starfield{opacity:.18}
body[data-theme="sora"] #bgFX{background:radial-gradient(ellipse at 50% -12%,#3a86c8 0%,transparent 62%),
 linear-gradient(180deg,#06182f,#12406c 55%,#050f22)}
body[data-theme="sora"] #bgFX .b1{background:#7fd6ff}
body[data-theme="sora"] #bgFX .b2{background:#ffffff}
body[data-theme="sora"] #bgFX .b3{background:#a8e6ff}
body[data-theme="sora"] #starfield{opacity:.25}
.thSw{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line-s)}
.thSw canvas{width:46px;height:46px;border-radius:12px;display:block}
.flashLayer{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:70}
#flashGold{background:radial-gradient(circle,var(--gold),transparent 68%)}
#flashCyan{background:radial-gradient(circle,var(--cyan),transparent 66%)}
#flashMag{background:radial-gradient(circle,var(--magenta),transparent 62%)}

.card{background:var(--glass);border:1px solid rgba(255,255,255,.11);box-shadow:var(--lift);
 backdrop-filter:blur(14px) saturate(1.25);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;
 border-radius:13px;font-size:14.5px;background:var(--glass-2);border:1px solid var(--line-s);
 box-shadow:var(--lift);color:var(--hi);text-shadow:var(--ink);transition:transform .08s,filter .12s}
.btn:active{transform:translateY(2px) scale(.985);filter:brightness(1.14)}
.btn.primary{background:linear-gradient(168deg,#2f7fff,#1748b8);border-color:rgba(140,190,255,.4)}
.btn.gold{background:var(--foil);color:#3a2600;text-shadow:none;border-color:rgba(255,240,190,.6)}
.btn.mag{background:linear-gradient(168deg,#ff6fd6,#c02a9a);border-color:rgba(255,180,235,.4)}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;
 background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12.5px;font-weight:800}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--lo);text-transform:uppercase}
.hide{display:none!important}

#app{position:relative;height:100%;display:flex;flex-direction:column}
#topBar{flex:none;display:flex;align-items:center;gap:9px;padding:calc(var(--safe-t) + 10px) 13px 8px}
#menuBtn{width:38px;height:38px;flex:none;display:flex;flex-direction:column;justify-content:center;
 align-items:center;gap:4px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
#menuBtn span{width:16px;height:2px;background:var(--mid);border-radius:2px}
#topTitle{flex:1;min-width:0}
#topTitle .t1{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topTitle .t2{font-size:10.5px;color:var(--lo);font-weight:700}
#topRight{display:flex;gap:6px}
#main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex;animation:scIn .26s cubic-bezier(.2,.9,.3,1)}
@keyframes scIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ------------------------------------------------------------------ home */
#homeScroll{flex:1;overflow-y:auto;padding:2px 13px 24px}
#hero{position:relative;border-radius:22px;padding:18px;margin-bottom:13px;overflow:hidden;
 background:var(--glass);border:1px solid rgba(255,255,255,.12);box-shadow:var(--lift)}
#heroCv{position:absolute;inset:0}
#heroIn{position:relative}
#logo,.logoTx{font-size:31px;font-weight:900;line-height:1.02;letter-spacing:-.01em;
 background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 6px rgba(255,215,107,.32))}
#logoSub,.logoSubTx{font-size:10.5px;letter-spacing:.26em;color:var(--lo);font-weight:800;margin-top:5px}
#heroBtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#gbar{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--lo);font-weight:800}
#gbarT{flex:1;height:7px;border-radius:99px;background:rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden}
#gbarT i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.secH{display:flex;align-items:baseline;justify-content:space-between;margin:17px 2px 9px}
.secH h3{font-size:13.5px;font-weight:800}
#chapWrap{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);font-size:12px;font-weight:800;white-space:nowrap;color:var(--mid)}
.chip.on{background:var(--foil);color:#3a2600;border-color:rgba(255,240,190,.6)}
.chip.lk{opacity:.35}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
.nd{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 box-shadow:var(--lift);font-weight:900;position:relative;color:var(--mid)}
.nd:active{transform:translateY(2px)}
.nd .n{font-size:16px}
.nd .s{font-size:8px;color:var(--gold);margin-top:2px;letter-spacing:.5px}
.nd.now{background:linear-gradient(168deg,#2f7fff,#1748b8);color:#fff;border-color:rgba(140,190,255,.5)}
.nd.now::after{content:"";position:absolute;inset:-4px;border-radius:18px;
 border:1.5px solid var(--cyan);opacity:.55;animation:pg 1.7s ease-out infinite}
@keyframes pg{0%{transform:scale(.96);opacity:.6}70%,100%{transform:scale(1.15);opacity:0}}
.nd.done{color:var(--hi)}
.nd.lk{opacity:.3}
.qrow{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;
 background:var(--glass);border:1px solid var(--line);margin-bottom:7px;box-shadow:var(--lift)}
.qbar{height:6px;border-radius:99px;background:rgba(0,0,0,.5);border:1px solid var(--line);
 overflow:hidden;margin-top:5px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}

/* ------------------------------------------------------------------ play */
#playHead{flex:none;display:flex;align-items:center;gap:9px;padding:0 11px 5px}
#backBtn{width:32px;height:32px;flex:none;border-radius:10px;background:rgba(255,255,255,.06);
 border:1px solid var(--line);font-size:13px;color:var(--mid)}
#playTitle{flex:1;min-width:0}
/* Who came with you, right next to the stage number — the party bar under the
   board is easy to miss while you are looking at the puzzle. */
#playParty{flex:none;display:flex;gap:3px;align-items:center;padding-left:6px}
#playParty canvas{width:26px;height:26px;display:block}
#playParty .pp{position:relative}
#playParty .pp i{position:absolute;right:-1px;bottom:-2px;font-size:6px;
 font-style:normal;color:var(--gold);text-shadow:0 0 3px #000}
#playTitle .a{font-size:13.5px;font-weight:800;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playTitle .b{font-size:10px;color:var(--lo);font-weight:700;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud{flex:none;display:flex;gap:6px;padding:0 11px 5px}
.hcell{flex:1;padding:5px 4px;border-radius:12px;background:var(--glass);border:1px solid var(--line);
 text-align:center;box-shadow:var(--lift)}
.hcell .k{font-size:8.5px;font-weight:800;letter-spacing:.09em;color:var(--lo)}
.hcell .v{font-size:16px;font-weight:900;line-height:1.2}
.hcell.warn .v{color:var(--red)}
#goalBar{flex:none;text-align:center;font-size:10.5px;color:var(--lo);font-weight:700;padding-bottom:3px}
#goalBar b{color:var(--gold)}
/* position:relative so the party strip can float in the side gutter without
   stealing a single pixel from the board. */
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
 padding:0 3px;position:relative}
#stage{position:relative;touch-action:none}
#cv{display:block}
#comboPopup{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.5);
 font-size:36px;font-weight:900;opacity:0;pointer-events:none;z-index:3;white-space:nowrap;
 background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 8px rgba(255,215,107,.5))}
#comboPopup.go{animation:cb .85s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-9deg)}
 22%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(4deg)}
 68%{opacity:1;transform:translate(-50%,-58%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-92%) scale(.9)}}
#tipLine{flex:none;text-align:center;font-size:11px;font-weight:800;color:var(--gold);
 min-height:1.15em;padding-bottom:2px}
#itemBar{flex:none;display:flex;gap:7px;padding:5px 11px calc(var(--safe-b) + 8px);justify-content:center}
.item{flex:1;max-width:88px;padding:6px 3px;border-radius:12px;background:var(--glass);
 border:1px solid var(--line);box-shadow:var(--lift);text-align:center;position:relative}
.item:active{transform:translateY(2px)}
.item .ic{font-size:16px}
.item .lb{font-size:9px;font-weight:800;color:var(--lo);margin-top:1px}
.item .ct{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:99px;
 background:linear-gradient(168deg,#ff6fd6,#c02a9a);font-size:10px;font-weight:900;
 display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,180,235,.5);padding:0 4px}
.item.no{opacity:.42}
.item.act{border-color:var(--magenta);background:var(--glass-2)}
.item.urge{border-color:var(--gold);animation:urg 1s ease-in-out infinite}
@keyframes urg{0%,100%{box-shadow:var(--lift),0 0 0 0 rgba(255,215,107,.55)}
 50%{box-shadow:var(--lift),0 0 0 7px rgba(255,215,107,0)}}

/* -------------------------------------------------------------- overlays */
.ov{position:fixed;inset:0;z-index:76;display:none;align-items:center;justify-content:center;
 padding:16px;background:rgba(4,6,14,.82);backdrop-filter:blur(8px)}
.ov.on{display:flex}
.ovc{width:100%;max-width:400px;max-height:calc(100% - 20px);overflow-y:auto;padding:20px;
 animation:ci .34s cubic-bezier(.2,1.3,.4,1)}
@keyframes ci{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
#rRibbon{display:inline-block;padding:5px 16px;border-radius:99px;font-size:10px;font-weight:900;
 letter-spacing:.16em;margin-bottom:9px;border:1px solid var(--line-s)}
#rTitle{font-size:23px;font-weight:900}
#rStars{display:flex;gap:8px;justify-content:center;margin:13px 0 2px}
#rStars span{font-size:31px;filter:grayscale(1) brightness(.4);transform:scale(.78);
 transition:all .34s cubic-bezier(.2,1.7,.4,1)}
#rStars span.lit{filter:none;transform:scale(1.13);text-shadow:0 0 18px rgba(255,215,107,.7)}
#rLine{font-size:12.5px;color:var(--mid);margin:8px 0;line-height:1.8}
#rRew{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:11px 0}
#rBtns{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
#rBtns .btn{flex:1;min-width:102px}
/* the double-your-reward offer: one glance, two lines, never a paragraph */
.dblRow{flex:1 0 100%;display:flex;align-items:center;gap:10px;text-align:left;
 padding:10px 11px;border-radius:14px;margin-bottom:3px;
 background:linear-gradient(120deg,rgba(255,95,208,.22),rgba(21,27,48,.92));
 border:1px solid rgba(255,180,235,.42);box-shadow:var(--lift)}
.dblRow .ic{font-size:20px;flex:none}
.dblRow .g{flex:1;min-width:0}
.dblRow .t{font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dblRow .s{font-size:11px;color:var(--hi);opacity:.85;margin-top:2px;white-space:nowrap}
.dblRow .s b{color:var(--gold)}
.dblRow .btn{flex:none;min-width:0}
.dblRow.done{background:linear-gradient(120deg,rgba(110,231,160,.2),rgba(21,27,48,.92));
 border-color:rgba(110,231,160,.45)}
#kingStage{height:158px;display:flex;align-items:center;justify-content:center;position:relative}

/* ------------------------------------------------------- drawer / sheet */
#drawerScrim{position:fixed;inset:0;z-index:70;background:rgba(4,6,14,.7);display:none}
#drawerScrim.on{display:block}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(82%,300px);z-index:71;
 background:linear-gradient(180deg,rgba(22,29,54,.98),rgba(13,17,32,.99));
 border-right:1px solid var(--line-s);transform:translateX(-102%);
 transition:transform .27s cubic-bezier(.3,1,.4,1);display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawerHead{padding:calc(var(--safe-t) + 19px) 15px 13px;border-bottom:1px solid var(--line)}
#drawerList{flex:1;overflow-y:auto;padding:7px}
.di{display:flex;align-items:center;gap:11px;padding:11px;border-radius:11px;font-weight:800;
 font-size:13.5px;width:100%;text-align:left;color:var(--mid)}
.di:active{background:rgba(255,255,255,.07)}
.di .ic{font-size:16px;width:20px;text-align:center}
.di .bd{margin-left:auto;background:linear-gradient(168deg,#ff6fd6,#c02a9a);font-size:9.5px;
 font-weight:900;padding:1px 7px;border-radius:99px}
#drawerFoot{padding:11px 15px calc(var(--safe-b) + 13px);font-size:9.5px;color:var(--lo);
 border-top:1px solid var(--line);line-height:1.6}
#sheet{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;
 background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
 opacity:0;visibility:hidden;pointer-events:none;transform:translateY(16px) scale(.995);
 transition:opacity .2s ease,transform .26s cubic-bezier(.2,.9,.3,1),visibility 0s linear .26s}
#sheet.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;
 transition:opacity .2s ease,transform .26s cubic-bezier(.2,.9,.3,1),visibility 0s}
#sheetBody.sw{animation:swIn .22s ease}
@keyframes swIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#sheetBar{flex:none;display:flex;align-items:center;gap:9px;
 padding:calc(var(--safe-t) + 11px) 13px 10px;border-bottom:1px solid var(--line)}
#sheetTitle{flex:1;font-size:15.5px;font-weight:800}
#sheetBody{flex:1;overflow-y:auto;
 padding:13px 13px calc(var(--safe-b) + var(--tabH) + var(--bannerH) + 26px)}
.row{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--glass);
 border:1px solid var(--line);margin-bottom:8px;box-shadow:var(--lift)}
.row .g{flex:1;min-width:0}
.row .t{font-weight:800;font-size:13.5px}
.row .s{font-size:11px;color:var(--lo);line-height:1.5;margin-top:2px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:9.5px;font-weight:900;
 background:var(--green);color:#04301a;margin-left:5px}
.tag.n{background:var(--magenta);color:#fff}
.dexG{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.dexC{padding:8px 5px;border-radius:15px;border:1px solid var(--line);background:var(--glass);
 text-align:center;box-shadow:var(--lift);position:relative}
.dexC canvas{width:100%;height:auto;display:block}
.dexC .nm{font-size:10.5px;font-weight:800;margin-top:3px}
.dexC .rr{font-size:9.5px}
.dexC.dim{opacity:.3;filter:grayscale(1)}
.dexC.eq{border-color:var(--magenta);box-shadow:var(--lift),0 0 0 1px var(--magenta)}
.dexC .eb{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:900;
 background:linear-gradient(168deg,#ff6fd6,#c02a9a);padding:1px 7px;border-radius:99px;white-space:nowrap}
.setR{display:flex;align-items:center;gap:10px;padding:11px 2px}
.setR .lb{flex:1;font-weight:800;font-size:13.5px}
.seg{display:flex;border-radius:99px;border:1px solid var(--line-s);overflow:hidden;background:rgba(0,0,0,.35)}
.seg button{padding:6px 13px;font-size:12px;font-weight:800;color:var(--mid)}
.seg button.on{background:var(--foil);color:#3a2600}
#legal{font-size:12px;line-height:1.85;color:var(--mid)}
#legal h4{color:var(--hi);font-size:13.5px;margin:16px 0 5px;font-weight:900}
#legal .fl{color:var(--gold);font-weight:800}
#cnFull{display:none;max-height:56vh;overflow-y:auto;margin-top:11px;padding:11px 12px;
 border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);
 -webkit-overflow-scrolling:touch}
#cnFull.on{display:block}
#cnFull h4{margin:14px 0 5px;font-size:12.5px;color:var(--hi)}
#cnFull h4:first-child{margin-top:0}
#cnFull p,#cnFull li{font-size:11px;color:var(--mid);line-height:1.75;margin:4px 0}
#cnFull ul,#cnFull ol{margin:4px 0 4px 17px}
#cnFull .fl{color:var(--red);font-weight:800}

/* Fixed, not min-height: a costume reveal and a cat reveal have to open at

#revealHero{height:168px;display:flex;align-items:center;justify-content:center;position:relative}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + var(--tabH) + var(--bannerH) + 22px);transform:translateX(-50%) translateY(12px);
 z-index:99;padding:10px 17px;border-radius:99px;background:rgba(10,14,28,.96);
 border:1px solid var(--line-s);font-size:12.5px;font-weight:800;opacity:0;pointer-events:none;

.shk{animation:sk .3s}
@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
 40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (min-width:740px){#homeScroll,#sheetBody{max-width:700px;margin:0 auto;width:100%}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* --------------------------------------------------------------- shop */
.shopSt{display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:11px 13px;border-radius:14px;margin-bottom:4px;
 background:linear-gradient(120deg,rgba(84,233,255,.14),rgba(21,27,48,.9));
 border:1px solid var(--line)}
.shopSt .k{font-size:10.5px;color:var(--lo);font-weight:800;letter-spacing:.04em}
.shopSt .v{font-size:13px;font-weight:900;color:var(--hi)}
.row.hi{border-color:rgba(255,215,107,.42);
 background:linear-gradient(120deg,rgba(255,215,107,.12),var(--glass))}
.tag.gd{background:var(--foil);color:#3a2600;border-color:rgba(255,240,190,.6)}
.catCard{display:flex;gap:11px;align-items:center;padding:11px;border-radius:16px;

.catCard .g{flex:1;min-width:0}
.catCard .nm{font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.catCard .r5{font-size:9px;color:var(--r5);letter-spacing:.06em}
.catCard .jb{font-size:10.5px;color:var(--lo);margin-top:1px}
.catCard .ef{font-size:11px;color:var(--mid);margin-top:4px;line-height:1.5}
.bundleCard{padding:14px;border-radius:18px;
 background:linear-gradient(140deg,rgba(255,215,107,.20),rgba(255,95,208,.15) 65%,rgba(21,27,48,.92));

.bundleCard .hd{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.bundleCard .off{font-size:10px;font-weight:900;padding:3px 7px;border-radius:99px;
 background:var(--magenta);color:#fff}
.bundleCard .ds{font-size:11.5px;color:var(--mid);margin-top:5px;line-height:1.6}
.bundleCard .was{font-size:10.5px;color:var(--lo);margin-top:6px;text-decoration:line-through}
.oddR{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:12px;

.oddR canvas{width:34px;height:34px;flex:none}
.oddR .g{flex:1;min-width:0}

/* ------------------------------------------------- 10-draw result grid */
/* Ten cards plus a header, a summary line and a button have to fit a short
   phone in landscape-ish space. The grid caps its own height and scrolls
   rather than pushing the close button off the bottom. */
#g10Grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 4px;

.g10c{position:relative;border-radius:12px;padding:4px 2px 5px;text-align:center;

.g10c canvas{width:100%;height:auto;display:block}

 background:var(--green);color:#04301a;border-radius:99px;padding:0 4px}
.g10c.r4{border-color:rgba(255,215,107,.55);background:linear-gradient(160deg,rgba(255,215,107,.16),var(--glass))}
.g10c.r5{border-color:var(--r5);background:linear-gradient(160deg,rgba(255,138,224,.22),var(--glass));
 box-shadow:var(--lift),0 0 0 1px var(--r5)}
@keyframes g10in{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
.gachaBtns{display:flex;gap:7px;margin-top:4px}
.gachaBtns .btn{flex:1}
.drawCard{padding:13px;border-radius:18px;margin-bottom:9px;

.drawCard .hd{font-size:14px;font-weight:900;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.drawCard .sub{font-size:11px;color:var(--mid);margin-top:4px;line-height:1.6}
/* ------------------------------------------------- home promo banner */
#promo{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:16px;
 margin-bottom:4px;cursor:pointer;
 background:linear-gradient(120deg,rgba(255,95,208,.20),rgba(84,233,255,.16) 70%,rgba(21,27,48,.92));
 border:1px solid rgba(255,255,255,.16);box-shadow:var(--lift)}
#promo .ic{font-size:22px;flex:none}
#promo .g{flex:1;min-width:0}
#promo .t{font-size:12.5px;font-weight:900}
#promo .s{font-size:10.5px;color:var(--mid);margin-top:2px;line-height:1.5}

/* ------------------------------------------------------------- medals */
.medalRow{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.medal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
 justify-content:center;font-size:18px;border:2px solid rgba(255,255,255,.22);
 box-shadow:var(--lift)}
.medal.b{background:linear-gradient(145deg,#C88A52,#8A5A2E)}
.medal.s{background:linear-gradient(145deg,#E4EAF4,#93A2BC)}
.medal.g{background:linear-gradient(145deg,#FFE39A,#C9932A)}
.medal.p{background:linear-gradient(145deg,#B9F2FF,#6FA8C4)}

 background:var(--glass);border:1px solid var(--line);margin-bottom:6px}

.achRow .md{width:34px;height:34px;border-radius:50%;flex:none;display:flex;
 align-items:center;justify-content:center;font-size:15px;border:2px solid rgba(255,255,255,.2)}
/* ------------------------------------------------------------- splash */
/* The attract screen. Cats drift and blink behind the logo until the player
   touches the glass — the first thing anyone sees should be the thing the
   game is about, not a progress bar. */
#title{position:fixed;inset:0;z-index:210;display:flex;align-items:center;
 justify-content:center;background:radial-gradient(circle at 50% 38%,#1b2340,#0a0d1a 72%);
 transition:opacity .45s ease}
#title.gone{opacity:0;pointer-events:none}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
#titleWrap{position:relative;text-align:center;padding:0 24px}
/* line-height:1 plus background-clip:text cuts the tail off the g. Giving the
   line room and a little bottom padding puts it back. */
#titleName{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.24;
 padding-bottom:.12em;
 background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 22px rgba(255,215,107,.35))}
#titleSub{font-size:11px;letter-spacing:.3em;color:var(--lo);font-weight:800;margin-top:9px}
#titleTap{margin-top:32px;font-size:13px;font-weight:800;color:var(--hi);
 animation:tapPulse 1.7s ease-in-out infinite}
@keyframes tapPulse{0%,100%{opacity:.35}50%{opacity:1}}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:16px;
 background:radial-gradient(circle at 50% 38%,#1b2340,#0a0d1a 70%);
 transition:opacity .5s ease}
#splash.gone{opacity:0;pointer-events:none}
#splash canvas{width:150px;height:150px}
#spName{font-size:26px;font-weight:900;letter-spacing:-.01em;line-height:1.24;
 padding-bottom:.12em;
 background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
#spSub{font-size:10px;letter-spacing:.26em;color:var(--lo);font-weight:800;margin-top:-10px}
#spBar{width:150px;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
#spBar i{display:block;height:100%;width:0%;border-radius:99px;background:var(--foil);
 transition:width .28s ease}
#spTip{font-size:11px;color:var(--lo);max-width:240px;text-align:center;line-height:1.6;
 padding:0 20px}

/* ------------------------------------------------------------- tab bar */
.profHead{display:flex;align-items:center;gap:13px;padding:13px;border-radius:16px;

.rankRow .nm{font-size:12.5px;font-weight:800}

.setR.volR .lb{flex:0 0 auto}

 background:

input.volSlider::-moz-range-thumb{width:19px;height:19px;border-radius:50%;
 background:#fff;border:2px solid rgba(0,0,0,.4);box-shadow:0 1px 5px rgba(0,0,0,.55)}
#tabBar{flex:none;position:relative;z-index:67;display:flex;

者の同意なく行われた購入について、当方は各ストアの返金手続きへのご案内以上の責任を負いません。</p>": "<p><b>2. Eligibility.</b> Anyone may play. Minors must obtain a parent or guardian’s consent before making a purchase. For purchases made without that consent, our responsibility is limited to directing you to the relevant store’s refund process.</p>", "<p><b>第3条（アカウント）</b> 本アプリはアカウント登録を必要としません。進行データは利用者の端末およびiCloud（有効な場合）にのみ保存され、当方は保有しません。端末の初期化、アプリの削除、iCloudの無効化等によりデータが失われた場合、当方は復元できません。</p>": "<p><b>3. Accounts.</b> No account is required. Your progress is stored only on your device and, if enabled, in your own iCloud. We hold no copy. If data is lost by resetting the device, deleting the app or turning off iCloud, we cannot recover it.</p>", "<p><b>第4条（有料アイテム）</b> 本アプリの有料アイテムは、Apple社またはGoogle社の各ストアを通じて販売されます。決済および課金に関する契約は各ストアと利用者との間で成立します。非消費型アイテムは同一ストアアカウントで「購入を復元」により再取得できます。期間限定の広告非表示（自動更新なし）は、期間の経過により自動的に終了し、自動更新も自動課金も行われません。また非更新型のため復元の対象外です。</p>": "<p><b>4. Paid items.</b> Paid items are sold through the Apple or Google store, and the payment contract is between you and that store. Non-consumable items can be recovered with Restore Purchases on the same store account. Timed ad-off passes end automatically when the period runs out; they never auto-renew, never charge you again, and because they are non-renewing they cannot be restored.</p>", "<p><b>第5条（ゲーム内通貨）</b> ゲーム内通貨「煮干し」は、プレイまたは広告視聴によってのみ入手できます。当方は「煮干し」を金銭で販売しません。「煮干し」は換金・払戻し・譲渡・相続のいずれもできず、本アプリの利用終了とともに消滅します。</p>": "<p><b>5. In-game currency.</b> Sardines are obtained only by playing or by watching reward videos. We never sell them for money. They cannot be exchanged for cash, refunded, transferred or inherited, and they cease to exist when you stop using the app.</p>", "<p><b>第6条（禁止事項）</b> 利用者は、本アプリの改変、リバースエンジニアリング、不正な手段による有料アイテムの取得、法令または公序良俗に反する行為を行ってはなりません。</p>": "<p><b>6. Prohibited conduct.</b> You may not modify or reverse-engineer the app, obtain paid items by illegitimate means, or use the app for anything unlawful.</p>", "<p><b>第7条（サービスの変更・終了）</b> 当方は、事前の通知なく本アプリの内容を変更し、または提供を終了することがあります。ただし、購入済みの非消費型アイテムについては、可能な範囲で継続利用に配慮します。</p>": "<p><b>7. Changes and discontinuation.</b> We may change or discontinue the app without notice. Where we can, we will preserve access to non-consumable items you have bought.</p>", "<p><b>第8条（免責）</b> 本アプリは現状有姿で提供されます。当方は、本アプリが利用者の特定の目的に適合すること、不具合が生じないことを保証しません。当方の責任は、法令上許される範囲において、利用者が当該事象の直前12か月間に本アプリに支払った金額を上限とします。なお、当方に故意または重過失がある場合、および消費者契約法その他の強行法規により免責が認められない場合には、この限りではありません。</p>": "<p><b>8. Disclaimer.</b> The app is provided as is. We do not warrant that it suits any particular purpose or that it is free of defects. To the extent permitted by law our liability is capped at what you paid for the app in the twelve months before the event. This cap does not apply to our wilful misconduct or gross negligence, or where consumer protection law does not allow it.</p>", "<p><b>第9条（準拠法・裁判管轄）</b> 本規約は日本法に準拠します。本アプリに関して紛争が生じた場合、当方の所在地を管轄する地方裁判所を第一審の専属的合意管轄裁判所とします。</p>": "<p><b>9. Governing law.</b> These terms are governed by Japanese law. Any dispute will be heard, at first instance, by the district court with jurisdiction over our address.</p>", "<p><b>1. 取得する情報</b></p><ul><li><b>当方が取得しない情報：</b>氏名、メールアドレス、電話番号、位置情報、連絡先、写真、およびプレイ内容の記録。当方はサーバーを保有しておらず、これらを受け取る手段がありません。</li><li><b>端末内にのみ保存される情報：</b>クリア状況、★の数、所持アイテム、設定、同意日時。これらは端末のローカルストレージに保存されます。</li><li><b>Apple iCloud：</b>iCloudを有効にしている場合、上記の進行データは利用者ご自身のiCloudアカウントに保存されます。保存先は利用者のアカウントであり、当方は参照できません。</li><li><b>広告事業者が取得する情報：</b>Google AdMob は、広告の配信および測定のため、広告識別子（IDFA／広告ID）、IPアドレス、端末情報、広告の表示・操作履歴等を取得する場合があります。</li><li><b>Game Center：</b>ランキングと実績を利用する場合、Apple社がプレイヤーIDおよびスコアを取り扱います。</li></ul>": "<p><b>1. What is collected</b></p><ul><li><b>What we never receive:</b> your name, email, phone number, location, contacts, photos, or any record of how you play. We run no server and have no way to receive them.</li><li><b>Stored only on your device:</b> stage progress, stars, items, settings and the date you accepted these terms, held in local storage.</li><li><b>Apple iCloud:</b> with iCloud enabled, that same progress is stored in your own iCloud account. It is your account, and we cannot read it.</li><li><b>Collected by the ad provider:</b> Google AdMob may collect an advertising identifier (IDFA / Ad ID), IP address, device information and ad interaction data in order to serve and measure ads.</li><li><b>Game Center:</b> if you use leaderboards or achievements, Apple handles your player ID and scores.</li></ul>", "<p><b>2. 利用目的</b> 端末内データは進行状況の保存および表示のためにのみ利用します。広告識別子等は、広告の配信、頻度調整、不正防止および効果測定のために広告事業者が利用します。</p>": "<p><b>2. Purpose.</b> On-device data is used only to save and display your progress. Advertising identifiers are used by the ad provider to serve ads, cap frequency, prevent fraud and measure performance.</p>", "<p><b>3. 第三者提供</b> 当方が利用者の情報を第三者に提供することはありません。広告事業者による情報の取扱いは、各事業者のプライバシーポリシーによります。Google のポリシーは policies.google.com/privacy、Apple のポリシーは apple.com/legal/privacy をご確認ください。</p>": "<p><b>3. Disclosure to third parties.</b> We disclose nothing, because we hold nothing. Handling by the ad provider is governed by its own policy: see policies.google.com/privacy and apple.com/legal/privacy.</p>", "<p><b>4. 同意の撤回と選択</b> アプリ内の「設定 → 広告とプライバシー」から、興味に合わせた広告の許可をいつでも変更できます。iOSでは端末の「設定 → プライバシーとセキュリティ → トラッキング」からアプリのトラッキングを拒否できます。拒否した場合も本アプリはすべての機能をご利用いただけます。</p>": "<p><b>4. Withdrawing consent.</b> You can change your personalised-ads choice at any time under Settings → Ads and privacy. On iOS you can also refuse tracking under Settings → Privacy & Security → Tracking. Refusing costs you no features whatsoever.</p>", "<p><b>5. 保存期間</b> 端末内データはアプリを削除するまで保存されます。アプリ内の「設定 → データを消す」でいつでも消去できます。iCloud上のデータは、端末のiCloud設定から削除できます。</p>": "<p><b>5. Retention.</b> On-device data is kept until you delete the app. You can erase it at any time under Settings → Erase data. iCloud copies can be removed from your device’s iCloud settings.</p>", "<p><b>6. 利用者の権利</b> 当方は個人データを保有していないため、開示・訂正・削除のご請求に対しては、端末内での削除方法をご案内する対応となります。広告事業者が保有するデータについては、各事業者へ直接ご請求ください。</p>": "<p><b>6. Your rights.</b> Because we hold no personal data, a request to access, correct or delete it can only be answered by showing you how to erase it on your device. For data held by the ad provider, please contact that provider directly.</p>", "<p><b>7. 子どものプライバシー</b> 本アプリは13歳未満の児童を対象としていません。当方が児童から個人情報を意図的に収集することはありません。保護者の方は、端末の設定により広告のパーソナライズおよびアプリ内課金を制限することができます。</p>": "<p><b>7. Children.</b> This app is not directed at children under 13, and we never knowingly collect personal information from them. Parents can restrict personalised ads and in-app purchases from the device settings.</p>", "<p><b>8. 国外への移転</b> 広告事業者およびApple社は、日本国外のサーバーで情報を処理する場合があります。移転先の国の個人情報保護制度および当該事業者の講じる措置については、各事業者の公表資料をご確認ください。</p>": "<p><b>8. International transfers.</b> The ad provider and Apple may process information on servers outside Japan. For the data-protection regime of the destination country and the safeguards each provider applies, please see their published material.</p>", "<p><b>9. 改定</b> 本ポリシーを重要な点で改定した場合、アプリ起動時に改めて同意をお願いします。</p>": "<p><b>9. Changes.</b> If we change this policy in any material way, we will ask for your consent again the next time you open the app.</p>", "<p><b>10. お問い合わせ</b> ": "<p><b>10. Contact.</b> ", "<h4>利用している第三者サービス</h4><ul><li>Google AdMob（広告配信）</li><li>Apple Game Center（ランキング・実績／iOSのみ）</li><li>Apple iCloud キーバリューストア（進行データの同期／iOSのみ）</li><li>Apple App Store ／ Google Play（課金処理）</li></ul>": "<h4>Third-party services used</h4><ul><li>Google AdMob (advertising)</li><li>Apple Game Center (leaderboards and achievements, iOS only)</li><li>Apple iCloud key-value store (progress sync, iOS only)</li><li>Apple App Store / Google Play (payment processing)</li></ul>", "<br>販売価格：各商品ページに表示（消費税込み）<br>商品代金以外の必要料金：通信料は利用者のご負担となります<br>お支払方法：Apple ID または Google アカウントによるストア決済<br>お支払時期：購入手続きの完了時<br>引渡時期：決済完了後ただちに<br>返品・キャンセル：デジタル商品の性質上、決済完了後の返品はお受けできません。各ストアの返金ポリシーに従います。<br>動作環境：iOS 15 以上 ／ Android /* =========================================================================
   キングキャッツ / KING CAT  v1.1
   ---------------------------------------------------------------------------
   THE RULE
     * Drag a wall inward. The box loses that row or column FOR GOOD, and the
       view zooms so the smaller box always fills the screen — every squeeze
       makes the cats bigger.
     * Everything packs away from the wall. 2+ touching cats of the same kind
       pop, the gap closes, and it can pop again — chains.
     * One cat wears a crown. It is the only one of its kind, so it can never
       find a partner and can never pop.
     * WIN the moment ONE cat is left. That cat is always the king.
     * Boards never exceed 6x6. Difficulty comes from colours, rocks and
       density, not from a board that grows until it stops fitting a phone.
     * STARS are the push count, not a score threshold: par = 3 stars,
       par+1 = 2 stars, cleared = 1 star. Every par was solved exhaustively
       offline, so 3 stars is always provably reachable.

   WHY IT IS ALWAYS SOLVABLE
     Every ordinary colour is seeded an EVEN number of times, so nobody else
     can be stranded. The king being unpoppable is not a bug worked around —
     it IS the goal. On top of that, all 1000 boards were brute-forced offline
     (the tree is at most (w-1)+(h-1) deep, so the search is exhaustive, not a
     heuristic) to confirm the throne is reachable. Nothing solves at runtime.
     There is no server anywhere in this product.
   ========================================================================= */

/* ------------------------------------------------------------------ engine */
const DIRS=['left','right','up','down'];
const TOW={right:'left',left:'right',down:'up',up:'down'};
const ROCK=-1,KING=-2,POPK=2;
const bclone=st=>({w:st.w,h:st.h,g:st.g.map(r=>r.slice())});
const bkey=st=>st.w+','+st.h+','+st.g.map(r=>r.map(c=>c===null?'.':c).join(',')).join('|');
function catsIn(st){let n=0;for(const r of st.g)for(const c of r)if(c!==null&&c!==ROCK)n++;return n;}

/* rocks never move and cut the lane they sit in, so packing runs per segment */
function packLine(v,id,low){
 const n=v.length,ov=Array(n).fill(null),oi=Array(n).fill(null);let s=0;
 for(let i=0;i<=n;i++){
  if(i<n&&v[i]!==ROCK)continue;
  const keep=[];
  for(let k=s;k<i;k++)if(v[k]!==null)keep.push([v[k],id?id[k]:null]);
  const len=i-s,off=low?0:len-keep.length;
  keep.forEach((p,k)=>{ov[s+off+k]=p[0];oi[s+off+k]=p[1];});
  if(i<n){ov[i]=ROCK;oi[i]=id?id[i]:null;}
  s=i+1;}
 return[ov,oi];}
function packAll(g,ids,w,h,tw){
 const ng=Array.from({length:h},()=>Array(w).fill(null));
 const ni=Array.from({length:h},()=>Array(w).fill(null));
 if(tw==='left'||tw==='right'){const low=tw==='left';
  for(let r=0;r<h;r++){const[a,b]=packLine(g[r],ids?ids[r]:null,low);ng[r]=a;ni[r]=b;}}
 else{const low=tw==='up';
  for(let c=0;c<w;c++){const col=[],ci=[];
   for(let r=0;r<h;r++){col.push(g[r][c]);ci.push(ids?ids[r][c]:null);}
   const[a,b]=packLine(col,ids?ci:null,low);
   for(let r=0;r<h;r++){ng[r][c]=a[r];ni[r][c]=b[r];}}}
 return[ng,ni];}
function findGroups(g,w,h){
 const seen=Array.from({length:h},()=>Array(w).fill(false)),out=[];
 for(let r=0;r<h;r++)for(let c=0;c<w;c++){
  const v=g[r][c];
  if(seen[r][c]||v===null||v===ROCK||v===KING)continue;
  const stk=[[r,c]],grp=[];seen[r][c]=true;
  while(stk.length){const[y,x]=stk.pop();grp.push([y,x]);
   for(const[dy,dx]of[[1,0],[-1,0],[0,1],[0,-1]]){const ny=y+dy,nx=x+dx;
    if(ny<0||nx<0||ny>=h||nx>=w||seen[ny][nx]||g[ny][nx]!==v)continue;
    seen[ny][nx]=true;stk.push([ny,nx]);}}
  if(grp.length>=POPK)out.push(grp);}
 return out;}
/* would the contents still fit after losing a row / column? */
/* is this wall blocked by an immovable rock rather than by crowding? */
function rockBlocked(wall){
 const st=G.st;if(!st)return false;
 const g=packAll(st.g,null,st.w,st.h,TOW[wall])[0];
 if(wall==='left'){for(let r=0;r<st.h;r++)if(g[r][0]===ROCK)return true;return false;}
 if(wall==='right'){for(let r=0;r<st.h;r++)if(g[r][st.w-1]===ROCK)return true;return false;}
 if(wall==='up'){for(let c=0;c<st.w;c++)if(g[0][c]===ROCK)return true;return false;}
 for(let c=0;c<st.w;c++)if(g[st.h-1][c]===ROCK)return true;
 return false;}
/* A push is legal only if, AFTER everything slides, the line the wall is
   about to swallow is completely empty.

   The old rule counted occupants against the width. That is correct on an
   open board and wrong the moment a rock is present: rocks never move, and
   they split a row into independent segments that pack separately, so a cat
   stranded on the wall side of a rock had nowhere to go. The count said "it
   fits" and the squeeze quietly deleted the cat — or the rock itself.
   Simulating the slide and inspecting the doomed line is the only rule that
   cannot lie about this.

   What the player can now rely on:
     * nothing is ever pushed out of the box — not a cat, not a rock
     * a rock resting against a wall blocks that wall permanently
     * a cat trapped between a rock and a wall blocks it until the cat pops */
function fits(st,wall){
 if((wall==='left'||wall==='right')&&st.w<=1)return false;
 if((wall==='up'||wall==='down')&&st.h<=1)return false;
 const g=packAll(st.g,null,st.w,st.h,TOW[wall])[0];
 if(wall==='left'){for(let r=0;r<st.h;r++)if(g[r][0]!==null)return false;return true;}
 if(wall==='right'){for(let r=0;r<st.h;r++)if(g[r][st.w-1]!==null)return false;return true;}
 if(wall==='up'){for(let c=0;c<st.w;c++)if(g[0][c]!==null)return false;return true;}
 for(let c=0;c<st.w;c++)if(g[st.h-1][c]!==null)return false;
 return true;}
/* Returns the new box plus a frame timeline, in ORIGINAL board coordinates, so
   the renderer can slide the walls in and follow every cat individually. */
function doPush(st0,wall,trace){
 if(!fits(st0,wall))return null;
 const tw=TOW[wall];
 let w=st0.w,h=st0.h,g=st0.g.map(r=>r.slice());
 let ids=null,look=null;
 if(trace){ids=Array.from({length:h},()=>Array(w).fill(null));look={};let id=1;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++)if(g[r][c]!==null){ids[r][c]=id;look[id]={v:g[r][c]};id++;}}
 let ox=0,oy=0;
 const frames=trace?[]:null;
 const snap=()=>{const m={};
  for(let r=0;r<h;r++)for(let c=0;c<w;c++)if(ids[r][c]!==null)m[ids[r][c]]={r:r+oy,c:c+ox};return m;};
 if(trace)frames.push({k:'idle',w,h,ox,oy,pos:snap()});
 let out=packAll(g,ids,w,h,tw);g=out[0];if(trace)ids=out[1];
 if(trace)frames.push({k:'pack',w,h,ox,oy,pos:snap()});
 if(wall==='right'){g=g.map(r=>r.slice(0,w-1));if(trace)ids=ids.map(r=>r.slice(0,w-1));w--;}
 else if(wall==='left'){g=g.map(r=>r.slice(1));if(trace)ids=ids.map(r=>r.slice(1));w--;ox++;}
 else if(wall==='down'){g=g.slice(0,h-1);if(trace)ids=ids.slice(0,h-1);h--;}
 else{g=g.slice(1);if(trace)ids=ids.slice(1);h--;oy++;}
 if(trace)frames.push({k:'shrink',w,h,ox,oy,pos:snap()});
 let chain=0,popped=0,score=0;
 for(;;){
  const gs=findGroups(g,w,h);
  if(!gs.length)break;
  chain++;
  const cells=[];
  for(const grp of gs)for(const[r,c]of grp){
   cells.push({r:r+oy,c:c+ox,v:g[r][c]});g[r][c]=null;if(trace)ids[r][c]=null;popped++;}
  score+=cells.length*45*chain+(cells.length>=4?cells.length*25:0);
  if(trace)frames.push({k:'pop',w,h,ox,oy,cells,chain,pos:snap()});
  out=packAll(g,ids,w,h,tw);g=out[0];if(trace)ids=out[1];
  if(trace)frames.push({k:'settle',w,h,ox,oy,pos:snap()});
 }
 return{st:{w,h,g},ox,oy,chain,popped,score,frames,look,wall,tw};
}
/* NEW RULE: the moment a single cat is left it can only be the king —
   he is the one kind with no partner, so he can never pop. No need to
   squeeze all the way down to 1x1 any more. */
const isWin=st=>catsIn(st)<=1;
function anyPush(st){for(const d of DIRS)if(fits(st,d))return true;return false;}
function decodeBoard(s,w,h){
 const g=[];for(let r=0;r<h;r++){const row=[];
  for(let c=0;c<w;c++){const ch=s[r*w+c];
   row.push(ch==='.'?null:ch==='#'?ROCK:ch==='K'?KING:'ABCDEF'.indexOf(ch));}
  g.push(row);}
 return{w,h,g};}
/* Every push permanently removes a row or a column, so the tree is at most
   (w-1)+(h-1) deep — 10 for the largest board we now ship. That makes an
   EXACT winnability test affordable at runtime, which two things depend on:
   a hint that is never wrong, and a dead-end warning the moment the board
   dies rather than three moves later. */
let WM=new Map();
function winnable(st){
 if(isWin(st))return true;
 const k=bkey(st);
 const c=WM.get(k);if(c!==undefined)return c;
 WM.set(k,false);
 let r=false;
 for(const d of DIRS){const x=doPush(st,d);if(x&&winnable(x.st)){r=true;break;}}
 WM.set(k,r);return r;}
/* runtime hint: a wall that still reaches the king, preferring the shortest
   route so the hint agrees with the ★★★ par */
function bestWall(st){
 let best=null;
 for(const d of DIRS){
  const r=doPush(st,d);
  if(!r)continue;
  const alive=winnable(r.st);
  const sc=(alive?100000:0)+r.popped*20+r.chain*40;
  if(!best||sc>best.sc)best={d,sc};}
 return best&&best.d;}

/* --------------------------------------------------------------------- art
   Drawn entirely in code: no image files, nothing to download, and the
   proportions can be squashed live, which is the whole joke of a squeezing
   game. The cuteness is deliberate geometry:
     - the head IS the body, wider than it is tall
     - ears sit clearly ABOVE the skull so the silhouette reads as a cat
     - eyes sit below the midline, far apart, and take a third of the face
     - blush is a soft gradient, never an outlined shape — an outlined cheek
       reads as a second pair of eyes, which is the classic way to make a
       cute face look wrong
     - a pale muzzle patch so the nose and mouth have somewhere to sit
     - short stubby paws and a fat comma tail kept clear of the face          */
const KINDS=[
 {ja:T('白'),  fur:'#FFF7EA',hi:'#FFFFFF',sh:'#E7D3B9',ear:'#FFC2D6',eye:'#3A2E57',ir:'#67CFF5',bl:'#FFA9C2',mk:'plain', ring:'#FFE6C9'},

 {ja:T('黒'),  fur:'#7E71B4',hi:'#B0A3E6',sh:'#4C4370',ear:'#C0B4EC',eye:'#FFD76B',ir:'#FFF0B8',bl:'#A594DE',mk:'plain', ring:'#B6A9E4'},
 {ja:T('空'),  fur:'#8FD1F7',hi:'#D8F3FF',sh:'#548FBC',ear:'#B6E4FF',eye:'#3A2E57',ir:'#4FB0E8',bl:'#FFA9C2',mk:'stripe',ring:'#C4EAFF'},
 {ja:T('三毛'),fur:'#FFF2DE',hi:'#FFFFFF',sh:'#E9D2A7',ear:'#FFC2D6',eye:'#3A2E57',ir:'#8FDCA9',bl:'#FFA9C2',mk:'calico',ring:'#FFE6C9'},
 {ja:T('桃'),  fur:'#FFBFD2',hi:'#FFE8F0',sh:'#EC85A3',ear:'#FFDAE4',eye:'#3A2E57',ir:'#FF8FBC',bl:'#FF7396',mk:'spot',  ring:'#FFDCE6'},
];

/* premium coats: a paid cat should be recognisable across the room */
const SKINS={
 cat_gin:{ja:T('銀'),  fur:'#E3EAF7',hi:'#FFFFFF',sh:'#A3B1D2',ear:'#CBD7F0',eye:'#3A2E57',ir:'#6FE3FF',bl:'#AEC0E8',mk:'shine',ring:'#EAF2FF',aura:'#8FE6FF'},
 cat_ame:{ja:T('雨'),  fur:'#A9BAEA',hi:'#DEE8FF',sh:'#6C80C2',ear:'#C3CFF6',eye:'#3A2E57',ir:'#AE95FF',bl:'#8E9EDA',mk:'drop', ring:'#CBD8FF',aura:'#B79BFF'},

const INK='#2E2447';

/* o:{squash,blink,mood,tilt,alpha,scale,king,glow,rays,sparkle,skin,now} */
function drawCat(g,cx,cy,size,kind,o){
 o=o||{};
 const K=o.skin?SKINS[o.skin]:(o.king?KINGSKIN:KINDS[((kind%6)+6)%6]);
 if(!K)return;
 const sq=o.squash||1;
 const S=size*(o.scale===undefined?1:o.scale);
 if(S<=1)return;
 const lw=Math.max(1.3,S*.052);
 const sqc=Math.pow(Math.min(sq,2.1),.44);
 const hw=S*.43/sqc, hh=S*.375*sqc;
 const mood=o.mood||'idle';
 g.save();
 if(o.alpha!==undefined)g.globalAlpha=o.alpha;
 g.translate(cx,cy);
 if(o.tilt)g.rotate(o.tilt);
 g.lineJoin='round';g.lineCap='round';

 if(o.glow){
  const au=K.aura||K.ring;
  if(o.rays){const t=(o.now||0)/2600;
   g.save();g.globalCompositeOperation='lighter';g.globalAlpha=.15;g.rotate(t);
   for(let i=0;i<12;i++){g.rotate(Math.PI/6);
    const gr=g.createLinearGradient(0,0,0,-S*1.15);
    gr.addColorStop(0,au);gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.beginPath();
    g.moveTo(-S*.055,0);g.lineTo(0,-S*1.15);g.lineTo(S*.055,0);g.closePath();g.fill();}
   g.restore();}
  g.save();g.globalCompositeOperation='lighter';
  const hg=g.createRadialGradient(0,0,hh*.4,0,0,hw*1.75);
  hg.addColorStop(0,au);hg.addColorStop(1,'rgba(0,0,0,0)');
  g.globalAlpha=.4;g.fillStyle=hg;
  g.beginPath();g.ellipse(0,0,hw*1.75,hh*1.85,0,0,7);g.fill();g.restore();}

 /* contact shadow — without it the cats look like stickers */
 g.save();g.globalAlpha=.22;g.fillStyle='#000';
 g.beginPath();g.ellipse(0,hh*1.08,hw*.7,hh*.15,0,0,7);g.fill();g.restore();

 g.strokeStyle=INK;g.lineWidth=lw;

 /* fat comma tail, out to the side and well clear of the face */
 g.save();g.lineCap='round';
 g.strokeStyle=INK;g.lineWidth=lw*3.4;
 g.beginPath();g.moveTo(hw*.72,hh*.72);
 g.quadraticCurveTo(hw*1.66,hh*.72,hw*1.4,-hh*.16);
 g.stroke();
 g.strokeStyle=K.sh;g.lineWidth=lw*2.1;g.stroke();
 g.restore();

 /* ears — tall enough to clear the skull, rounded rather than spiky:
    spiky reads as "wild", round reads as "baby" */
 for(const s of[-1,1]){
  const ex=s*hw*.56;
  /* a rounded triangle whose bulk sits ABOVE the skull. Anything flatter gets
     swallowed by the head and leaves only an outlined arc, which reads as a
     bear rather than a cat. */
  const bi=[ex-s*hw*.34,-hh*.50], bo=[ex+s*hw*.34,-hh*.62], tp=[ex+s*hw*.08,-hh*1.52];
  g.beginPath();
  g.moveTo(bi[0],bi[1]);
  g.quadraticCurveTo(ex-s*hw*.26,-hh*1.12,tp[0],tp[1]);
  g.quadraticCurveTo(ex+s*hw*.34,-hh*1.10,bo[0],bo[1]);
  g.quadraticCurveTo(ex,-hh*.40,bi[0],bi[1]);
  g.closePath();
  const eg2=g.createLinearGradient(0,-hh*1.5,0,-hh*.4);
  eg2.addColorStop(0,K.hi);eg2.addColorStop(1,K.fur);
  g.fillStyle=eg2;g.fill();g.stroke();
  g.save();g.clip();
  g.fillStyle=K.ear;
  g.beginPath();
  g.moveTo(ex-s*hw*.19,-hh*.56);
  g.quadraticCurveTo(ex-s*hw*.14,-hh*1.02,ex+s*hw*.06,-hh*1.32);
  g.quadraticCurveTo(ex+s*hw*.20,-hh*1.00,ex+s*hw*.19,-hh*.62);
  g.quadraticCurveTo(ex,-hh*.44,ex-s*hw*.19,-hh*.56);
  g.closePath();g.fill();
  g.globalAlpha=.85;g.fillStyle=K.hi;
  for(let i=-1;i<2;i++){g.beginPath();
   g.ellipse(ex+i*hw*.07,-hh*.66,hw*.03,hh*.13,i*.4,0,7);g.fill();}
  g.restore();}

 /* stubby front paws poking out under the chin */
 for(const s of[-1,1]){
  g.beginPath();g.ellipse(s*hw*.4,hh*.94,hw*.24,hh*.17,0,0,7);
  g.fillStyle=K.fur;g.fill();g.stroke();
  g.save();g.globalAlpha=.5;g.fillStyle=K.bl;
  g.beginPath();g.ellipse(s*hw*.4,hh*.96,hw*.09,hh*.07,0,0,7);g.fill();g.restore();}

 /* head — a top-lit gradient reads as round and soft; a flat fill reads flat */
 g.beginPath();g.ellipse(0,0,hw,hh,0,0,7);
 const fg=g.createRadialGradient(-hw*.22,-hh*.46,hh*.05,0,hh*.1,hw*1.24);
 fg.addColorStop(0,K.hi);fg.addColorStop(.5,K.fur);fg.addColorStop(1,K.sh);
 g.fillStyle=fg;g.fill();g.stroke();

 /* markings, clipped to the head */
 g.save();g.beginPath();g.ellipse(0,0,hw,hh,0,0,7);g.clip();
 g.fillStyle=K.sh;
 if(K.mk==='stripe'){for(let i=0;i<3;i++){g.save();
   g.translate(0,-hh*.8+i*hh*.2);g.rotate(.2);
   g.globalAlpha=.75;
   g.fillRect(-hw*.34,-hh*.04,hw*.68,hh*.075);g.restore();}}
 else if(K.mk==='spot'){g.globalAlpha=.55;
   g.beginPath();g.arc(-hw*.52,-hh*.44,hw*.16,0,7);g.fill();
   g.beginPath();g.arc(hw*.56,-hh*.2,hw*.12,0,7);g.fill();}
 else if(K.mk==='calico'){
   g.fillStyle='#F9A25A';g.beginPath();
   g.ellipse(-hw*.62,-hh*.5,hw*.4,hh*.42,.3,0,7);g.fill();
   g.fillStyle='#7E71B4';g.beginPath();
   g.ellipse(hw*.66,-hh*.3,hw*.3,hh*.34,-.2,0,7);g.fill();}
 else if(K.mk==='royal'){g.fillStyle='#F2CE7A';g.globalAlpha=.8;
   for(let i=0;i<3;i++){g.beginPath();
    g.arc(-hw*.48+i*hw*.48,-hh*.66,hw*.11,0,7);g.fill();}}
 else if(K.mk==='shine'){g.save();g.globalAlpha=.5;g.fillStyle='#fff';
   g.beginPath();g.moveTo(-hw*1.1,-hh*.1);g.lineTo(-hw*.2,-hh*1.1);
   g.lineTo(hw*.16,-hh*1.1);g.lineTo(-hw*.72,hh*.2);g.closePath();g.fill();g.restore();}
 else if(K.mk==='drop'){g.globalAlpha=.6;
   for(const p of[[-.55,-.5],[.5,-.34],[-.08,-.62]]){g.save();
    g.translate(p[0]*hw,p[1]*hh);g.beginPath();
    g.moveTo(0,-hh*.16);g.quadraticCurveTo(hw*.11,0,0,hh*.11);
    g.quadraticCurveTo(-hw*.11,0,0,-hh*.16);g.fill();g.restore();}}
 else if(K.mk==='gem'){g.fillStyle='#FFF3D0';
   for(const p of[[-.52,-.5,.12],[.54,-.28,.09],[0,-.72,.07]]){
    g.beginPath();
    for(let i=0;i<4;i++){const a=i*Math.PI/2;
     const qx=Math.cos(a)*hw*p[2]*(i%2?.45:1.4),qy=Math.sin(a)*hh*p[2]*(i%2?1.4:.45);
     i?g.lineTo(p[0]*hw+qx,p[1]*hh+qy):g.moveTo(p[0]*hw+qx,p[1]*hh+qy);}
    g.closePath();g.fill();}}
 /* pale muzzle patch so the nose and mouth have somewhere to sit */
 g.globalAlpha=.5;g.fillStyle=K.hi;
 g.beginPath();g.ellipse(0,hh*.5,hw*.42,hh*.32,0,0,7);g.fill();
 g.restore();


 /* eyes: low, huge, glossy, and far enough apart to leave room for cheeks */
 const eyY=hh*.16, eyX=hw*.44;
 const blink=o.blink===undefined?1:o.blink;
 for(const s of[-1,1]){
  const x=s*eyX;
  if(mood==='sleep'){
   /* closed lids arc downward — the same curve as a smile flipped, which is
      the whole difference between "asleep" and "delighted" */
   g.save();g.strokeStyle=K.eye;g.lineWidth=lw*1.5;g.lineCap='round';
   g.beginPath();
   g.moveTo(x-hw*.15,eyY-hh*.02);
   g.quadraticCurveTo(x,eyY+hh*.17,x+hw*.15,eyY-hh*.02);
   g.stroke();g.restore();
  }else if(mood==='happy'||sq>1.5){
   g.save();g.strokeStyle=K.eye;g.lineWidth=lw*1.7;g.lineCap='round';
   g.beginPath();
   g.moveTo(x-hw*.16,eyY+hh*.08);
   g.quadraticCurveTo(x,eyY-hh*.2,x+hw*.16,eyY+hh*.08);
   g.stroke();g.restore();
  }else{
   const rw=hw*.21,rh=hh*.3*blink;
   const eg=g.createRadialGradient(x,eyY+rh*.36,rh*.08,x,eyY,rh*1.1);
   eg.addColorStop(0,K.ir);eg.addColorStop(.55,K.eye);eg.addColorStop(1,K.eye);
   g.fillStyle=eg;
   g.beginPath();g.ellipse(x,eyY,rw,rh,0,0,7);g.fill();
   if(blink>.5){
    g.fillStyle='#fff';
    g.beginPath();g.ellipse(x+rw*.3,eyY-rh*.42,rw*.4,rh*.36,-.3,0,7);g.fill();
    g.save();g.globalAlpha=.9;
    g.beginPath();g.arc(x-rw*.4,eyY+rh*.36,rw*.2,0,7);g.fill();
    g.globalAlpha=.45;
    g.beginPath();g.arc(x+rw*.02,eyY+rh*.6,rw*.13,0,7);g.fill();g.restore();
   }}}

 /* blush — a soft gradient with NO outline, sitting outside the eyes */
 g.save();g.globalAlpha=.65;
 for(const s of[-1,1]){
  const bx=s*hw*.76,by=eyY+hh*.3;
  const bg=g.createRadialGradient(bx,by,0,bx,by,hw*.24);
  bg.addColorStop(0,K.bl);bg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=bg;g.beginPath();g.ellipse(bx,by,hw*.24,hh*.17,0,0,7);g.fill();}
 g.restore();

 /* tiny nose + w mouth, kept small so the eyes dominate */
 const ny=eyY+hh*.36;
 g.fillStyle='#FF95AE';g.strokeStyle=INK;g.lineWidth=lw*.6;
 g.beginPath();
 g.moveTo(-hw*.075,ny);g.lineTo(hw*.075,ny);g.lineTo(0,ny+hh*.1);g.closePath();
 g.fill();g.stroke();
 g.strokeStyle=INK;g.lineWidth=lw*.72;
 if(mood==='shock'){g.fillStyle=INK;
  g.beginPath();g.ellipse(0,ny+hh*.24,hw*.09,hh*.11,0,0,7);g.fill();}
 else if(mood==='happy'){
  g.beginPath();
  g.moveTo(-hw*.17,ny+hh*.1);
  g.quadraticCurveTo(-hw*.085,ny+hh*.3,0,ny+hh*.12);
  g.quadraticCurveTo(hw*.085,ny+hh*.3,hw*.17,ny+hh*.1);
  g.quadraticCurveTo(0,ny+hh*.44,-hw*.17,ny+hh*.1);
  g.closePath();g.fillStyle='#7A4059';g.fill();g.stroke();
  g.fillStyle='#FF95AE';g.beginPath();
  g.ellipse(0,ny+hh*.3,hw*.075,hh*.06,0,0,7);g.fill();}
 else if(mood==='sleep'){
  /* a small closed mouth; the open grin is what made the pile look awake */
  g.beginPath();
  g.moveTo(-hw*.08,ny+hh*.13);g.quadraticCurveTo(0,ny+hh*.20,hw*.08,ny+hh*.13);
  g.stroke();}
 else if(mood==='squish'){
  g.beginPath();g.ellipse(0,ny+hh*.22,hw*.14,hh*.07,0,0,7);
  g.fillStyle=INK;g.fill();}
 else{g.beginPath();
  g.moveTo(0,ny+hh*.1);g.quadraticCurveTo(-hw*.09,ny+hh*.26,-hw*.17,ny+hh*.12);
  g.moveTo(0,ny+hh*.1);g.quadraticCurveTo(hw*.09,ny+hh*.26,hw*.17,ny+hh*.12);
  g.stroke();}

 /* whiskers */
 g.save();g.globalAlpha=.3;g.strokeStyle=INK;g.lineWidth=lw*.42;
 for(const s of[-1,1])for(let i=0;i<2;i++){g.beginPath();
  g.moveTo(s*hw*.3,ny+i*hh*.13);
  g.quadraticCurveTo(s*hw*.72,ny-hh*.06+i*hh*.18,s*hw*1.02,ny-hh*.12+i*hh*.24);
  g.stroke();}
 g.restore();

 if(o.cos){const CC=COSBY(o.cos);
  drawCos(g,CC?CC.art:o.cos,hw,hh,S,lw,K,CC);}
 if(o.king)drawCrown(g,0,-hh*1.62,S*.44,lw);
 if(o.sparkle){const t=(o.now||0)/620;
  g.save();g.globalAlpha=.9;g.fillStyle='#fff';
  for(let i=0;i<3;i++){
   const a=t+i*2.1,rr=hw*(1.15+.12*Math.sin(t*1.7+i));
   const sx=Math.cos(a)*rr,sy=Math.sin(a*1.3)*hh*1.05;
   const k=S*.05*(.6+.4*Math.sin(t*3+i));
   g.beginPath();
   g.moveTo(sx,sy-k);g.quadraticCurveTo(sx,sy,sx+k,sy);
   g.quadraticCurveTo(sx,sy,sx,sy+k);g.quadraticCurveTo(sx,sy,sx-k,sy);
   g.quadraticCurveTo(sx,sy,sx,sy-k);g.fill();}
  g.restore();}
 g.restore();
}
/* Costumes are drawn, not textured: one more small routine per item and it
   scales with the cat, squashes with the cat, and costs nothing to download. */
/* Eight shapes, recoloured per costume. Each cat has its own outfit, so the
   colours come from the costume record rather than being baked in here. */
function drawCos(g,art,hw,hh,S,lw,K,C){
 const A=(C&&C.c1)||'#FF6FA8', B=(C&&C.c2)||'#FFD7E6';
 g.save();g.lineJoin='round';g.lineCap='round';
 g.strokeStyle=INK;g.lineWidth=lw*.8;
 if(art==='ribbon'){
  const x=-hw*.62,y=-hh*1.06;
  g.fillStyle=A;
  for(const s2 of[-1,1]){g.beginPath();
   g.moveTo(x,y);
   g.quadraticCurveTo(x+s2*hw*.34,y-hh*.30,x+s2*hw*.30,y+hh*.06);
   g.quadraticCurveTo(x+s2*hw*.16,y+hh*.14,x,y);
   g.closePath();g.fill();g.stroke();}
  g.fillStyle=B;g.beginPath();g.arc(x,y,hw*.09,0,7);g.fill();g.stroke();
 }else if(art==='scarf'){
  g.fillStyle=A;
  g.beginPath();
  g.moveTo(-hw*.72,hh*.72);
  g.quadraticCurveTo(0,hh*1.06,hw*.72,hh*.72);
  g.quadraticCurveTo(hw*.66,hh*.94,hw*.6,hh*1.0);
  g.quadraticCurveTo(0,hh*1.3,-hw*.6,hh*1.0);
  g.quadraticCurveTo(-hw*.66,hh*.94,-hw*.72,hh*.72);
  g.closePath();g.fill();g.stroke();
  g.fillStyle=B;
  g.beginPath();g.moveTo(hw*.42,hh*.94);g.lineTo(hw*.68,hh*1.34);
  g.lineTo(hw*.3,hh*1.2);g.closePath();g.fill();g.stroke();
 }else if(art==='cap'){
  g.fillStyle=A;
  g.beginPath();g.ellipse(0,-hh*.9,hw*.62,hh*.42,0,Math.PI,0);g.fill();g.stroke();
  g.beginPath();
  g.moveTo(-hw*.6,-hh*.88);g.quadraticCurveTo(0,-hh*.62,hw*.86,-hh*.82);
  g.quadraticCurveTo(hw*.5,-hh*.7,-hw*.6,-hh*.74);
  g.closePath();g.fill();g.stroke();
  g.fillStyle=B;g.beginPath();g.arc(0,-hh*1.28,hw*.09,0,7);g.fill();g.stroke();
 }else if(art==='flower'){
  const x=hw*.62,y=-hh*1.0;
  g.fillStyle=A;
  for(let i=0;i<5;i++){const a=i*Math.PI*2/5;
   g.beginPath();g.ellipse(x+Math.cos(a)*hw*.14,y+Math.sin(a)*hh*.16,
    hw*.11,hh*.13,a,0,7);g.fill();g.stroke();}
  g.fillStyle=B;g.beginPath();g.arc(x,y,hw*.08,0,7);g.fill();g.stroke();
 }else if(art==='glasses'){
  g.strokeStyle=A;g.lineWidth=lw*.9;
  for(const s2 of[-1,1]){g.beginPath();
   g.ellipse(s2*hw*.44,hh*.16,hw*.26,hh*.3,0,0,7);g.stroke();}
  g.beginPath();g.moveTo(-hw*.18,hh*.14);g.lineTo(hw*.18,hh*.14);g.stroke();
  g.save();g.globalAlpha=.30;g.fillStyle=B;
  for(const s2 of[-1,1]){g.beginPath();
   g.ellipse(s2*hw*.44,hh*.16,hw*.25,hh*.29,0,0,7);g.fill();}
  g.restore();
 }else if(art==='bell'){
  g.strokeStyle=A;g.lineWidth=lw*1.6;
  g.beginPath();g.moveTo(-hw*.6,hh*.78);
  g.quadraticCurveTo(0,hh*1.04,hw*.6,hh*.78);g.stroke();
  const bg=g.createRadialGradient(-hw*.03,hh*.94,hh*.02,0,hh*1.0,hw*.2);
  bg.addColorStop(0,B);bg.addColorStop(1,'#D9A32B');
  g.fillStyle=bg;g.strokeStyle=INK;g.lineWidth=lw*.7;
  g.beginPath();g.arc(0,hh*1.0,hw*.15,0,7);g.fill();g.stroke();
  g.beginPath();g.moveTo(-hw*.09,hh*1.03);g.lineTo(hw*.09,hh*1.03);g.stroke();
 }else if(art==='crownlet'){
  /* it used to be barely six pixels across on a board cat — big enough to
     read at party-strip size now, and the outline is thinner so the colour
     still shows through */
  g.lineWidth=lw*.55;
  g.fillStyle=A;
  g.beginPath();
  g.moveTo(-hw*.44,-hh*1.04);g.lineTo(-hw*.44,-hh*1.34);g.lineTo(-hw*.21,-hh*1.19);
  g.lineTo(0,-hh*1.56);g.lineTo(hw*.21,-hh*1.19);g.lineTo(hw*.44,-hh*1.34);
  g.lineTo(hw*.44,-hh*1.04);g.closePath();g.fill();g.stroke();
  g.fillStyle=B;g.beginPath();g.arc(0,-hh*1.19,hw*.085,0,7);g.fill();g.stroke();
 }else if(art==='gcrown'){
  /* the paid crown: full width of the head, jewelled, unmistakably not the
     little ★5 crownlet from the draw */
  g.lineWidth=lw*.55;
  const gg=g.createLinearGradient(0,-hh*1.8,0,-hh*1.0);
  gg.addColorStop(0,B);gg.addColorStop(.48,A);gg.addColorStop(1,'#C9932A');
  g.fillStyle=gg;
  g.beginPath();
  g.moveTo(-hw*.56,-hh*1.02);
  g.lineTo(-hw*.56,-hh*1.44);g.lineTo(-hw*.30,-hh*1.20);
  g.lineTo(0,-hh*1.72);g.lineTo(hw*.30,-hh*1.20);
  g.lineTo(hw*.56,-hh*1.44);g.lineTo(hw*.56,-hh*1.02);
  g.closePath();g.fill();g.stroke();
  g.fillStyle='#FF5FD0';
  for(const s2 of[-1,0,1]){g.beginPath();
   g.arc(s2*hw*.28,-hh*1.13,hw*.062,0,7);g.fill();g.stroke();}
  g.fillStyle=B;g.beginPath();g.arc(0,-hh*1.78,hw*.075,0,7);g.fill();g.stroke();
 }else if(art==='wings'){
  /* wide and low, so they read as wings behind the shoulders rather than
     as a second pair of ears */
  g.lineWidth=lw*.5;
  for(const s2 of[-1,1]){
   g.save();g.translate(s2*hw*.72,hh*.34);g.scale(s2,1);
   const wg=g.createLinearGradient(0,-hh*.8,0,hh*.5);
   wg.addColorStop(0,B);wg.addColorStop(1,A);
   g.fillStyle=wg;
   g.beginPath();
   g.moveTo(0,hh*.20);
   g.quadraticCurveTo(hw*.20,-hh*.86,hw*.86,-hh*.74);
   g.quadraticCurveTo(hw*.62,-hh*.24,hw*.92,-hh*.04);
   g.quadraticCurveTo(hw*.54,hh*.14,hw*.70,hh*.44);
   g.quadraticCurveTo(hw*.26,hh*.44,0,hh*.20);
   g.closePath();g.fill();g.stroke();
   g.save();g.globalAlpha=.42;g.strokeStyle=INK;
   g.beginPath();
   g.moveTo(hw*.10,hh*.10);g.quadraticCurveTo(hw*.44,-hh*.34,hw*.78,-hh*.62);
   g.moveTo(hw*.14,hh*.22);g.quadraticCurveTo(hw*.48,-hh*.06,hw*.84,-hh*.12);
   g.stroke();g.restore();
   g.restore();}
 }else if(art==='cape'){
  /* it has to live above the bottom of the sprite, or a board cell clips it */
  g.lineWidth=lw*.55;
  const cg=g.createLinearGradient(0,hh*.5,0,hh*1.3);
  cg.addColorStop(0,A);cg.addColorStop(1,'#241653');
  g.fillStyle=cg;
  g.beginPath();
  g.moveTo(-hw*.80,hh*.56);
  g.quadraticCurveTo(-hw*1.12,hh*1.02,-hw*.86,hh*1.24);
  g.quadraticCurveTo(0,hh*.92,hw*.86,hh*1.24);
  g.quadraticCurveTo(hw*1.12,hh*1.02,hw*.80,hh*.56);
  g.quadraticCurveTo(0,hh*.86,-hw*.80,hh*.56);
  g.closePath();g.fill();g.stroke();
  g.fillStyle=B;star4(g,0,hh*.74,hw*.19,0);
 }else if(art==='halo'){
  g.save();g.globalCompositeOperation='lighter';
  g.strokeStyle=A;g.lineWidth=lw*1.4;g.shadowColor=B;g.shadowBlur=S*.16;
  g.beginPath();g.ellipse(0,-hh*1.5,hw*.44,hh*.14,0,0,7);g.stroke();g.restore();
 }
 g.restore();
}
function drawCrown(g,cx,cy,w,lw){
 g.save();g.translate(cx,cy);
 const h=w*.62;
 g.beginPath();
 g.moveTo(-w/2,h*.42);
 g.lineTo(-w/2,-h*.12);g.lineTo(-w*.26,h*.16);g.lineTo(0,-h*.54);
 g.lineTo(w*.26,h*.16);g.lineTo(w/2,-h*.12);g.lineTo(w/2,h*.42);
 g.closePath();
 const grd=g.createLinearGradient(-w/2,-h/2,w/2,h/2);
 grd.addColorStop(0,'#FFF6D8');grd.addColorStop(.45,'#FFD76B');
 grd.addColorStop(.7,'#C9932A');grd.addColorStop(1,'#FFE9A8');
 g.fillStyle=grd;g.fill();
 g.strokeStyle=INK;g.lineWidth=lw*.95;g.lineJoin='round';g.stroke();
 g.fillStyle='#FF5FD0';
 for(const x of[-w*.26,0,w*.26]){g.beginPath();g.arc(x,h*.2,w*.075,0,7);g.fill();}
 g.fillStyle='#54E9FF';g.beginPath();g.arc(0,-h*.4,w*.07,0,7);g.fill();
 g.restore();
}
function drawRock(g,cx,cy,size){
 g.save();g.translate(cx,cy);
 const R=size*.34;
 const pts=[[-1,-.5],[-.34,-1],[.56,-.82],[1,-.06],[.7,.82],[-.22,1],[-.92,.48]];
 g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]*R,p[1]*R):g.moveTo(p[0]*R,p[1]*R));
 g.closePath();
 const rg=g.createLinearGradient(-R,-R,R,R);
 rg.addColorStop(0,'#6E7BAA');rg.addColorStop(1,'#3D4674');
 g.fillStyle=rg;g.fill();
 g.strokeStyle=INK;g.lineWidth=Math.max(1.6,size*.045);g.lineJoin='round';g.stroke();
 g.save();g.clip();g.globalAlpha=.5;g.fillStyle='#939FCE';
 g.beginPath();g.moveTo(-R,-R);g.lineTo(R*.22,-R);g.lineTo(-R,R*.4);g.closePath();g.fill();g.restore();
 g.strokeStyle=INK;g.lineWidth=Math.max(1.2,size*.03);g.lineCap='round';
 for(const s of[-1,1]){g.beginPath();g.arc(s*R*.32,-R*.02,R*.15,Math.PI*1.13,Math.PI*1.87);g.stroke();}
 g.beginPath();g.arc(0,R*.3,R*.1,Math.PI*.15,Math.PI*.85);g.stroke();
 g.restore();

const A=(()=>{let ac,mg,rv,lim,mus;

    which leaves all of a triangle or square wave's upper harmonics intact —
    exactly the frequencies a phone speaker exaggerates and an ear reads as
    "painful" rather than "bright". Every voice now passes through a gentle
    lowpass on the way out, attacks are a touch slower than an instant
    on-switch, and nothing sharp-edged (square, sawtooth) is used for a tone
    meant to feel good. Nothing here changes what a sound MEANS, only how
    it feels to hear it fifty times in a row. */
 function ctx(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();
   mg=ac.createGain();mg.gain.value=SOUND_MAX*soundLevel();

      The music bus joins here too (see out()), so effects and pad share one
      output stage and a loud pop leans on the pad instead of stacking on
      top of it. */
   lim=ac.createDynamicsCompressor();
   lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=12;
   lim.attack.value=.003;lim.release.value=.25;
   mg.connect(lim);lim.connect(ac.destination);
   /* short reverb send. Each delay line feeds ONLY itself and its gain is
      below 1, so the tail always decays. Sharing a damper between lines and
      returning it to both is what made an earlier build's reverb run away. */
   rv=ac.createGain();rv.gain.value=.26;
   const line=(time,fb,cut)=>{
    const d=ac.createDelay(1.0);d.delayTime.value=time;
    const f=ac.createGain();f.gain.value=fb;
    const dp=ac.createBiquadFilter();dp.type='lowpass';dp.frequency.value=cut;
    rv.connect(d);d.connect(dp);dp.connect(f);f.connect(d);d.connect(mg);};
   line(.079,.42,2600);line(.131,.36,2200);

  if(c){mg.gain.cancelScheduledValues(c.currentTime);
   mg.gain.setValueAtTime(mg.gain.value,c.currentTime);
   mg.gain.linearRampToValueAtTime(v,c.currentTime+.08);}

    rather than sharing the effects one: a shared compressor would duck the
    pad every time a chain popped, and a background pad that breathes in and
    out on every hit is more distracting than no pad at all. */

   filter, drifting between four related chords, with a wind-chime voice

   ========================================================================== */
const MUSIC=(()=>{

    drifting between them never feels like a "change", only a breath */
 const CHORDS=[
  [130.81,196.00,164.81,246.94],   // C  G  E  B  (Cadd9-ish, spread)
  [110.00,164.81,196.00,220.00],   // A  E  G  A  (Am7-ish)
  [174.61,130.81,220.00,261.63],   // F  C  A  C  (Fadd9-ish)
  [196.00,146.83,220.00,293.66],   // G  D  A  D  (Gsus2-ish)

  if(!playing)return;

  if(!playing)return;

  master.gain.cancelScheduledValues(c.currentTime);

  if(!playing)return;

   oldMaster.gain.setValueAtTime(oldMaster.gain.value,c.currentTime);

 return{start,stop,toggle,applyVol};
})();

/* VOLUME
   Two dials, each a continuous 0-100 slider rather than five steps.

   The old ceilings were SOUND_MAX .30 and MUSIC_MAX .075 — the music bus
   sat four times below the effects bus, and on top of that the pad layers
   were never opened, so "music at full" was a handful of chimes at roughly
   0.003 peak against effects at 0.07. Both ceilings are raised and brought
   into line: effects peak a little above the pad, which is how a mix
   normally sits, but the two are now in the same room as each other.

   Loudness is perceived roughly logarithmically, so a raw linear slider
   spends its bottom half sounding like silence. The curve below bends the
   travel so every part of the slider does something audible. */
const volCurve=p=>{p=Math.max(0,Math.min(100,+p||0))/100;
 return p<=0?0:Math.pow(p,1.55);};
const SOUND_MAX=.78, MUSIC_MAX=.46;
const LAYER_G=.105;   /* per pad voice, four of them */
const CHIME_G=.085;   /* the wandering wind-chime on top */
const SOUND_DEF=85, MUSIC_DEF=70;
const soundPct=()=>{const v=S.set.soundV;return v===undefined?SOUND_DEF:v;};
const musicPct=()=>{const v=S.set.musicV;return v===undefined?MUSIC_DEF:v;};
const soundLevel=()=>volCurve(soundPct());
const musicLevel=()=>volCurve(musicPct());
/* Saves exist with three older shapes: a plain on/off boolean, and a 0-4
   step index. Both are folded into the percentage the slider uses, once,
   on load. Nobody's setting is thrown away. */
function migrateAudio(){
 const st=S.set, M=[0,30,55,78,100];
 if(typeof st.soundVol==='number')st.soundV=M[Math.max(0,Math.min(4,Math.round(st.soundVol)))];
 else if(typeof st.sound==='boolean'&&st.soundV===undefined)st.soundV=st.sound?SOUND_DEF:0;
 if(typeof st.musicVol==='number')st.musicV=M[Math.max(0,Math.min(4,Math.round(st.musicVol)))];
 else if(typeof st.music==='boolean'&&st.musicV===undefined)st.musicV=st.music?MUSIC_DEF:0;
 delete st.sound;delete st.music;delete st.soundVol;delete st.musicVol;
 if(typeof st.soundV!=='number'||!isFinite(st.soundV))st.soundV=SOUND_DEF;
 if(typeof st.musicV!=='number'||!isFinite(st.musicV))st.musicV=MUSIC_DEF;
 st.soundV=Math.max(0,Math.min(100,Math.round(st.soundV)));
 st.musicV=Math.max(0,Math.min(100,Math.round(st.musicV)));
}
const vib=ms=>{if(S.set.vib&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}};

/* The camera. The box shrinks for good, so the view zooms to keep it filling
   the screen — every squeeze literally makes the cats bigger, and the last
   push blows the king up to fill the board. That zoom IS the progress bar. */
/* The view zooms as the box shrinks, which is the whole charm — but past a
   certain point one cat fills the screen and you lose all sense of the
   board. Two cells across is the floor: at 1x1 the king is still drawn at
   the same size he was at 2x2 rather than ballooning. */
const MIN_SPAN=2;
function viewFor(st,ox,oy){
 const span=Math.max(MIN_SPAN,st.w,st.h);
 /* Two caps, and the tighter one wins.

    The first is the margin the layout reserved. The second is the one that
    was missing: the walls hang 0.3 of a cell OUTSIDE the box on every side,
    so the whole thing occupies cell*(span+0.6). As the box shrank the view
    zoomed, the cells grew, and the walls grew with them until they ran off
    the edge of the canvas — which is exactly when the frame looked cut off.
    Sizing against span+0.62 keeps the walls on screen at every box size. */
 const cell=Math.min((G.size-G.pad*2)/span, G.size/(span+.62));
 return{cell,
  cx:(ox+st.w/2),cy:(oy+st.h/2),   /* box centre in original board coords */
  w:st.w,h:st.h};
}
/* The companions live in the empty space to the right of the stage title.
   They are never in the column above or below the board, so the board keeps
   every pixel of the screen it can get. */
function placeParty(){
 const bar=$('partyBar');if(!bar)return;
 const ph=$('playHead');
 if(bar.parentNode!==ph)ph.appendChild(bar);

const BOARD_MAX=640;   /* was 540 — tablets and desktop get a real board now */
function layout(){
 const wrap=$('stageWrap'),cv=$('cv');
 placeParty();
 const size=Math.max(200,Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight,BOARD_MAX)));
 G.size=size;
 /* The canvas margin only has to be wide enough to hold the walls (0.3 cell
    thick). It used to be a flat 8.5% of the canvas, which on a 6x6 board threw
    away far more room than the walls needed. Solving pad = 0.34 * cell gives
    the walls their clearance and hands everything else back to the cats —
    about +3% on a 4x4 board and +9% on a 6x6. */
 const span=Math.max(G.W||5,G.H||5);
 G.pad=Math.round(size*.34/(span+.68));
 const dpr=Math.min(devicePixelRatio||1,2.5);
 cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
 $('stage').style.width=size+'px';$('stage').style.height=size+'px';
 G.ctx=cv.getContext('2d');G.ctx.setTransform(dpr,0,0,dpr,0,0);
 if(G.st)G.view=viewFor(G.st,G.ox||0,G.oy||0);
}

 if($('scPlay').classList.contains('on')&&G.ctx)draw(now);

 requestAnimationFrame(frame);

 g.save();
 g.clearRect(0,0,SZ,SZ);
 drawPartyBg(g,SZ);
 if(G.shakeT>0){const k=G.shakeAmp*(G.shakeT/.34);
  g.translate((Math.random()-.5)*k,(Math.random()-.5)*k);}

 const an=G.anim;
 let V,pos,look,squash=1,wallDir=null,wallIn=0;

 if(an){

  const F=an.frames,u=t*(F.length-1);
  const i0=Math.min(Math.floor(u),F.length-1),i1=Math.min(i0+1,F.length-1);
  let f=u-i0;
  const A0=F[i0],A1=F[i1];
  if(A1.k==='pack')f=eOut(Math.min(1,f*1.3));
  else if(A1.k==='shrink')f=eBack(f);   /* the wall overshoots, then settles */
  else f=eOut(f);
  V=blendView(an.views[i0],an.views[i1],f);
  pos={};
  const ids=new Set([...Object.keys(A0.pos),...Object.keys(A1.pos)]);
  for(const id of ids){const a=A0.pos[id],b=A1.pos[id];
   if(a&&b)pos[id]={r:lerp(a.r,b.r,f),c:lerp(a.c,b.c,f)};
   else if(a)pos[id]={r:a.r,c:a.c};}
  look=an.look;
  const packing=(A1.k==='pack')?f:(A0.k==='pack'?1-Math.min(1,f*2.2):0);
  squash=1+.8*Math.sin(clamp(packing,0,1)*Math.PI*.5);
  wallDir=an.wall;wallIn=Math.sin(clamp(packing,0,1)*Math.PI*.5);
  if(A0.k==='pack'&&f>.03&&!an.boinged){an.boinged=true;A.boing();}
  if(A1.k==='shrink'&&f>.55&&!an.dusted){an.dusted=true;
   const b2x=px(V.cx-V.w/2-.5,V),b2y=py(V.cy-V.h/2-.5,V);
   wallDust(an.wall,b2x,b2y,V.w*V.cell,V.h*V.cell,V.cell);
   A.slam();shake(7);}
  for(const ev of an.events)if(!ev.done&&u>=ev.at){ev.done=true;
   const big=ev.cells.length>=4;
   for(const c of ev.cells)boom(px(c.c,V),py(c.r,V),c.v,ev.chain,big,V.cell);
   A.pop(ev.chain,ev.cells.length);vib(ev.chain>1?26:12);
   shake(3+ev.chain*3.5+(big?4:0));
   if(ev.chain>=2){showCombo(ev.chain);flashLayer('flashMag',150);}
   if(ev.chain>=3){popText(SZ/2,SZ*.66,T('すごい！'),'#ffd76b');
    flashLayer('flashGold',220);confetti(14,SZ);}
   if(ev.chain>=4)popText(SZ/2,SZ*.5,T('猫大爆発！'),'#54e9ff');}
  if(t>=1)finishAnim();
 }else{
  V=G.viewT<1?blendView(G.view,G.viewTo,eOut(G.viewT)):(G.viewTo||G.view);
  pos={};look={};let id=1;
  for(let r=0;r<G.st.h;r++)for(let c=0;c<G.st.w;c++){
   const v=G.st.g[r][c];if(v===null)continue;
   pos[id]={r:r+G.oy,c:c+G.ox};look[id]={v};id++;}
  if(G.drag&&G.drag.wall){wallDir=G.drag.wall;wallIn=G.drag.amt||0;squash=1+.45*wallIn;}
 }

 /* box floor + cells */
 const bx=px(V.cx-V.w/2-.5,V), by=py(V.cy-V.h/2-.5,V);
 const bw=V.w*V.cell, bh=V.h*V.cell;
 g.save();
 const TH=curTheme();
 g.fillStyle=TH.floor;
 /* legibility floor, applied to every theme including the paid ones */
 g.beginPath();g.roundRect(bx,by,bw,bh,V.cell*.2);g.fill();
 const cw=Math.round(V.w),chh=Math.round(V.h);
 for(let r=0;r<chh;r++)for(let c=0;c<cw;c++){

  g.beginPath();g.roundRect(bx+c*V.cell+m,by+r*V.cell+m,V.cell-m*2,V.cell-m*2,V.cell*.16);g.fill();}
 themeScrim(g,bx,by,bw,bh,V.cell);
 g.restore();
 drawWalls(g,bx,by,bw,bh,V.cell,wallDir,wallIn);

 for(let r=0;r<G.st.h;r++)for(let c=0;c<G.st.w;c++)
  if(G.st.g[r][c]===ROCK)drawRock(g,px(c+G.ox,V),py(r+G.oy,V),V.cell*.86);

 for(const id in pos){
  const p=pos[id],lk=look[id];if(!lk||lk.v===ROCK)continue;
  const king=lk.v===KING;
  const seed=(Math.round(p.r)*7+Math.round(p.c)*13+(king?9:lk.v))*97;

  drawCat(g,px(p.c,V),py(p.r,V)+bob,V.cell*.95,king?0:lk.v,

    rays:king,sparkle:king,
    mood:squash>1.45?'squish':'idle',scale:G.mode&&!an?1.04:1,
    skin:king?null:null,now});}

 if(G.mode&&!an){g.save();g.globalAlpha=.14+.08*Math.sin(now/220);
  g.fillStyle=G.mode==='paw'?'#ff5fd0':'#54e9ff';g.fillRect(0,0,SZ,SZ);g.restore();
  /* ring the cats already chosen so a two-tap item never feels ambiguous */
  g.save();g.strokeStyle=G.mode==='paw'?'#ff5fd0':'#54e9ff';g.lineWidth=Math.max(2,V.cell*.06);
  for(const q of G.pick){g.beginPath();
   g.arc(px(q.c+G.ox,V),py(q.r+G.oy,V),V.cell*.46,0,7);g.stroke();}
  /* after the first paw tap, mark the cats that are still a legal partner */
  if(G.mode==='paw'&&G.pick.length===1){
   const want=G.pick[0].v;g.globalAlpha=.55+.25*Math.sin(now/180);g.fillStyle='#ff5fd0';
   for(let r=0;r<G.st.h;r++)for(let c=0;c<G.st.w;c++){
    if(G.st.g[r][c]!==want)continue;
    if(r===G.pick[0].r&&c===G.pick[0].c)continue;
    g.beginPath();g.arc(px(c+G.ox,V),py(r+G.oy,V)+V.cell*.4,V.cell*.075,0,7);g.fill();}}
  g.restore();}
 if(G.hint&&!an)drawHint(g,bx,by,bw,bh,V.cell,now);
 fxDraw(g);
 g.restore();
}
/* The walls are the only thing the player touches, so they get real weight:
   a thicker slab, rollers along the face, a shadow cast into the box, and a
   hot leading edge that brightens as it bites in. */
function drawWalls(g,bx,by,bw,bh,cell,dir,inAmt){
 const t=cell*.3,a=inAmt||0,off=a*cell*.46;
 const W=[{d:'left', x:bx-t+(dir==='left'?off:0), y:by-t,w:t,h:bh+t*2},
  {d:'right',x:bx+bw-(dir==='right'?off:0),y:by-t,w:t,h:bh+t*2},
  {d:'up',   x:bx-t,y:by-t+(dir==='up'?off:0),w:bw+t*2,h:t},
  {d:'down', x:bx-t,y:by+bh-(dir==='down'?off:0),w:bw+t*2,h:t}];
 for(const wl of W){
  const act=wl.d===dir;
  const hz=wl.w>wl.h;
  g.save();
  if(act&&a>.02){
   /* shadow thrown ahead of the moving wall */
   g.save();g.globalAlpha=.34*a;g.fillStyle='#05070f';
   const d2=cell*.5*a;
   g.beginPath();
   if(wl.d==='left')g.roundRect(wl.x+wl.w,wl.y,d2,wl.h,cell*.1);
   else if(wl.d==='right')g.roundRect(wl.x-d2,wl.y,d2,wl.h,cell*.1);
   else if(wl.d==='up')g.roundRect(wl.x,wl.y+wl.h,wl.w,d2,cell*.1);
   else g.roundRect(wl.x,wl.y-d2,wl.w,d2,cell*.1);
   g.fill();g.restore();}
  const grd=hz?g.createLinearGradient(0,wl.y,0,wl.y+wl.h)
              :g.createLinearGradient(wl.x,0,wl.x+wl.w,0);
  if(act){grd.addColorStop(0,'#fff6d8');grd.addColorStop(.36,'#ffd76b');
   grd.addColorStop(.72,'#d9a338');grd.addColorStop(1,'#8f6414');}
  else{grd.addColorStop(0,'#5a6aa6');grd.addColorStop(.5,'#3b4778');
   grd.addColorStop(1,'#232b4c');}
  g.fillStyle=grd;
  g.beginPath();g.roundRect(wl.x,wl.y,wl.w,wl.h,t*.3);g.fill();
  /* rollers */
  g.save();g.beginPath();g.roundRect(wl.x,wl.y,wl.w,wl.h,t*.3);g.clip();
  const n=hz?Math.max(2,Math.round(wl.w/(cell*.62))):Math.max(2,Math.round(wl.h/(cell*.62)));
  for(let i=0;i<n;i++){
   const cx=hz?wl.x+wl.w*(i+.5)/n:wl.x+wl.w/2;
   const cy=hz?wl.y+wl.h/2:wl.y+wl.h*(i+.5)/n;
   g.globalAlpha=.34;g.fillStyle='#0a0d1a';
   g.beginPath();g.arc(cx,cy,t*.26,0,7);g.fill();
   g.globalAlpha=.5;g.fillStyle=act?'#fff3cf':'#8ea0d6';
   g.beginPath();g.arc(cx-t*.05,cy-t*.06,t*.12,0,7);g.fill();}
  g.restore();
  g.strokeStyle='rgba(255,255,255,.26)';g.lineWidth=1.3;
  g.beginPath();g.roundRect(wl.x,wl.y,wl.w,wl.h,t*.3);g.stroke();
  /* hot leading edge */
  if(act){
   g.save();g.globalAlpha=.35+.65*a;
   g.strokeStyle='#fff8e0';g.lineWidth=Math.max(1.6,cell*.05*(.5+a));
   g.shadowColor='#ffd76b';g.shadowBlur=cell*.5*a;
   g.beginPath();
   if(wl.d==='left'){g.moveTo(wl.x+wl.w,wl.y+t*.3);g.lineTo(wl.x+wl.w,wl.y+wl.h-t*.3);}
   else if(wl.d==='right'){g.moveTo(wl.x,wl.y+t*.3);g.lineTo(wl.x,wl.y+wl.h-t*.3);}
   else if(wl.d==='up'){g.moveTo(wl.x+t*.3,wl.y+wl.h);g.lineTo(wl.x+wl.w-t*.3,wl.y+wl.h);}
   else{g.moveTo(wl.x+t*.3,wl.y);g.lineTo(wl.x+wl.w-t*.3,wl.y);}
   g.stroke();g.restore();}
  g.restore();}
}
function drawHint(g,bx,by,bw,bh,cell,now){
 const pulse=.5+.5*Math.sin(now/230);
 let x,y,rot;
 if(G.hint==='left'){x=bx-cell*.62;y=by+bh/2;rot=0;}
 if(G.hint==='right'){x=bx+bw+cell*.62;y=by+bh/2;rot=Math.PI;}
 if(G.hint==='up'){x=bx+bw/2;y=by-cell*.62;rot=Math.PI/2;}
 if(G.hint==='down'){x=bx+bw/2;y=by+bh+cell*.62;rot=-Math.PI/2;}
 g.save();g.globalAlpha=.45+pulse*.55;g.translate(x,y);g.rotate(rot);
 g.translate(pulse*cell*.12,0);
 const s=cell*.34;
 g.beginPath();g.moveTo(s,0);g.lineTo(-s*.6,-s*.8);g.lineTo(-s*.6,s*.8);g.closePath();
 g.fillStyle='#ffd76b';g.strokeStyle=INK;g.lineWidth=3;g.lineJoin='round';g.fill();g.stroke();
 g.restore();
}
